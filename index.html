  const CLOUD_SYNC_URL = "https://script.google.com/macros/s/AKfycbwkHmn7ajGSUYH1ILS8hwvnpWT7pPZ6tEYmRuEmKjSWUnTnWSnkto9MPfqpU-lBkgGf/exec";
  const uid = () => Math.random().toString(36).slice(2,10);
  function dedupeById(arr){
    const seen = new Set(); const out = [];
    for(const q of arr){ if(q && q.id && !seen.has(q.id)){ seen.add(q.id); out.push(q); } }
    return out;
  }
  const todayStr = () => new Date().toISOString().slice(0,10);
  function daysUntil(dateStr){
    if(!dateStr) return null;
    const target = new Date(dateStr+"T00:00:00");
    const now = new Date(); now.setHours(0,0,0,0);
    return Math.ceil((target-now)/86400000);
  }
  function toChinese(n){
    if(n===0) return "○";
    const digits="〇一二三四五六七八九";
    if(n<=10) return ["十","一","二","三","四","五","六","七","八","九","十"][n];
    if(n<20) return "十"+digits[n-10];
    return digits[Math.floor(n/10)]+"十"+(n%10?digits[n%10]:"");
  }
  function esc(s){
    return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // 把字串中的中文數字（含混在文字裡的，如「九十」「三十五」「一百二十」）轉成阿拉伯數字，供填空題模糊比對用
  function cnNumToArabic(s){
    const digitMap = {'零':0,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
    const unitMap = {'十':10,'百':100,'千':1000,'萬':10000};
    return String(s).replace(/[零一二兩三四五六七八九十百千萬]+/g, match => {
      let result=0, section=0, num=0;
      for(const ch of match){
        if(ch in digitMap){ num = digitMap[ch]; }
        else if(ch in unitMap){
          const unit = unitMap[ch];
          if(unit===10000){ section=(section+num)*unit; result+=section; section=0; }
          else{ section += (num||1)*unit; }
          num=0;
        }
      }
      result += section+num;
      return String(result);
    });
  }
  // 填空題模糊比對：忽略中文數字/阿拉伯數字寫法差異、全形半形、千分位逗號、空白、大小寫
  function normalizeFillAnswer(s){
    if(s===null||s===undefined) return "";
    let str = String(s).trim();
    str = str.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
    str = str.replace(/％/g, '%');
    str = toHalfWidthNum(str);   // 中文數字、分之、百分之、萬千百一律轉成阿拉伯數字
    str = str.replace(/[～〜－—–至]/g,'~').replace(/[，,；;、]/g,'').replace(/\s+/g,'').toLowerCase();
    return str;
  }

  // 數字填空題：抽出字串中依序出現的所有數字（中文數字、全形字一併轉換、千分位逗號去掉），
  // 作答時只比對「數字序列」是否一致，單位寫不寫都不影響（例如答案「每2年至少6小時」，輸入「2 6」也算對）
  function toHalfWidthNum(s){
    let str = String(s==null?"":s).replace(/[０-９．／]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
    const cnd = '[\\d零一二兩三四五六七八九十百千]+';
    str = str.replace(new RegExp('百分之('+cnd+')','g'), '$1%');          // 百分之六 → 六%
    str = str.replace(new RegExp('('+cnd+')分之('+cnd+')','g'), '$2/$1'); // 五分之一 → 一/五
    // 阿拉伯數字＋萬/千/百（如「15萬」「3百萬」）先換算成完整數字，再處理純中文數字
    let prev;
    do{ prev = str; str = str.replace(/(\d+(?:\.\d+)?)\s*([萬千百])/g, (m,n,u)=>String(parseFloat(n)*({'萬':10000,'千':1000,'百':100}[u]))); }while(str!==prev);
    str = cnNumToArabic(str);
    return str.replace(/(\d),(?=\d{3}(\D|$))/g, '$1');
  }
  function extractNumbers(s){
    return (toHalfWidthNum(s).match(/\d+(?:\.\d+)?/g)||[]).map(x=>String(parseFloat(x)));
  }
  // 把答案裡的數字挖空成「＿」當作答格式提示，例如「每2年至少6小時」→「每＿年至少＿小時」
  function numTemplate(s){
    return toHalfWidthNum(s).replace(/\d+(?:\.\d+)?/g, "＿");
  }
  // 從所有題庫自動挑出「答案是數字」的題目，轉成沒有選項的數字填空題：
  // ① 原本就是填空題且答案含數字；② 單選題且四個選項全部都含數字（代表這題考的是數字本身），取正確選項當答案。
  // 「何者錯誤/何者非」這類反向題、答案含超過3個數字的題目不納入（拿掉選項後無從作答或太難判斷）。
  // 停止出題（題目仍保留在題庫，只是練習/模擬考/錯題複習都不會抽到）：四烷基鉛中毒預防規則已廢止
  const SUSPENDED_IDS = new Set(["chN31-032","examA-088","examB-303","examB-304","examB-W01-301","examB-W01-302"]);
  const isActiveQ = q => !SUSPENDED_IDS.has(String(q&&q.id||"").replace(/^num-/,""));
  // 2026-10-27 重複題清理（dedup.js）：DUP_ALIAS 的 key 是被移除的重複題，value 是保留的同一題。
  // 載入時把重複題濾掉；它在錯題本／刷題紀錄上的進度，一律合併到保留的那題（數字填空 num- 前綴同理）。
  const DUP_ALIAS = window.DUP_ALIAS || {};
  const DUP_CHAPTER = window.DUP_CHAPTER || {};
  const notDupQ = q => !DUP_ALIAS[q.id];
  function dupTarget(id){
    const s = String(id), num = s.startsWith("num-"), base = num ? s.slice(4) : s;
    return DUP_ALIAS[base] ? (num?"num-":"") + DUP_ALIAS[base] : null;
  }
  // 同一題兩筆錯題紀錄合併：以較新的那筆為準（含已學會狀態），答錯次數取較大值
  function mergeWrongRec(a, b){
    if(!a) return b; if(!b) return a;
    const t = r => r.updatedAt || (r.lastSeen ? r.lastSeen+'T00:00:00' : '');
    const newer = t(b) > t(a) ? b : a;
    return {...newer, wrongCount: Math.max(a.wrongCount||0, b.wrongCount||0)};
  }
  // 結果與執行次數無關（重跑不會重複累加），所以每次載入、每次雲端合併後都可以放心套用
  function applyDupAlias(p){
    if(p.wrongMap){
      Object.keys(p.wrongMap).forEach(id=>{
        const to = dupTarget(id);
        if(!to) return;
        p.wrongMap[to] = mergeWrongRec(p.wrongMap[to], p.wrongMap[id]);
        delete p.wrongMap[id];
      });
    }
    ["quizSeenIds","examASeenIds","examBSeenIds"].forEach(k=>{
      const m = p[k]; if(!m) return;
      Object.keys(m).forEach(id=>{
        const to = dupTarget(id);
        if(!to) return;
        if(m[id]) m[to] = true;
        delete m[id];
      });
    });
    return p;
  }
  function buildNumericPool(){
    const out=[]; const seenKey=new Set();
    const hasDigit = s => extractNumbers(s).length>0;
    const reverseAsk = /何者(錯誤|有誤|非|不)|不正確|不屬|不包括|不適用|不必|不得/;
    function push(q, answer, origin){
      const nums = extractNumbers(answer);
      if(nums.length===0 || nums.length>3) return;
      const key = String(q.text).trim()+'|'+nums.join(',');
      if(seenKey.has(key)) return;
      seenKey.add(key);
      out.push({id:'num-'+q.id, type:'fill', numeric:true, chapter:q.chapter, origin,
        text:q.text, answer:String(answer), numHint:numTemplate(answer), note:q.note||""});
    }
    const sources = [
      ...state.questions.map(q=>[q, q.chapter==null ? '乙級題庫' : (q.chapter===0 ? '概論' : '第'+toChinese(q.chapter)+'章')]),
      ...state.examA.map(q=>[q,'甲種題庫']),
      ...state.examB.map(q=>[q,'乙級考古題']),
    ];
    sources.forEach(([q,origin])=>{
      if(!isActiveQ(q)) return;
      const t = q.type||'single';
      if(t==='fill'){
        if(hasDigit(q.answer)) push(q, q.answer, origin);
      } else if(t==='single' && Array.isArray(q.options) && q.options.length>=2){
        const opt = q.options[q.answer];
        if(opt==null || String(opt).length>20 || reverseAsk.test(q.text)) return;
        if(!q.options.every(o=>hasDigit(o))) return;
        push(q, opt, origin);
      }
    });
    return out;
  }
  // 填空題判斷對錯：數字填空題只比對數字序列，一般填空題沿用原本的模糊比對
  function isFillCorrect(q, input){
    if(q.numeric){
      const a = extractNumbers(q.answer), b = extractNumbers(input);
      return a.length>0 && a.length===b.length && a.every((v,i)=>v===b[i]);
    }
    if(normalizeFillAnswer(input) === normalizeFillAnswer(q.answer)) return true;
    // 答案本身只有數字（頂多帶%、℃、m³之類符號）時，只比數字：寫「3」「3年」「三」都算對
    const rest = toHalfWidthNum(q.answer).replace(/\d+(?:\.\d+)?/g,'');
    if(!/[一-鿿]/.test(rest)){
      const a = extractNumbers(q.answer), b = extractNumbers(input);
      return a.length>0 && a.length===b.length && a.every((v,i)=>v===b[i]);
    }
    return false;
  }
  // 每次出題都重新打亂選項順序；4個選項以上的題目有3成機率隨機拿掉一個選項，
  // 打破「ABC對、D錯」「答案總在某個位置」「複選題一定剛好錯一個」之類的作答慣性。
  // 單選題只拿掉錯誤選項；複選題可能拿掉錯誤或正確選項（至少留一個正確答案）。
  // 有「以上皆是/皆非」這類依賴位置的選項時維持原樣不動。
  function presentQuestion(q){
    const t = q.type||'single';
    if((t!=='single' && t!=='multi') || !Array.isArray(q.options) || q.options.length<2) return q;
    if(q.options.some(o=>/以上皆|皆是|皆非|皆正確|皆錯誤|以上都/.test(String(o)))) return q;
    const correctSet = new Set(t==='multi' ? q.answer : [q.answer]);
    let idx = q.options.map((_,i)=>i);
    if(idx.length>=4 && Math.random()<0.3){
      const removable = t==='multi'
        ? idx.filter(i=>!correctSet.has(i) || correctSet.size>1)
        : idx.filter(i=>!correctSet.has(i));
      if(removable.length){
        const r = removable[Math.floor(Math.random()*removable.length)];
        idx = idx.filter(i=>i!==r);
      }
    }
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
    const options = idx.map(i=>q.options[i]);
    const answer = t==='multi'
      ? idx.map((orig,newI)=>correctSet.has(orig)?newI:-1).filter(i=>i>=0)
      : idx.indexOf(q.answer);
    return {...q, options, answer};
  }
  // 正確率依目標 ACC_TARGET% 分級：達標／加強中／待加強，配合圖示＋文字，不單靠顏色辨識（2026-10-27 目標由85%改80%）
  const ACC_TARGET = 80;
  // 錯題本另訂較高的目標（2026-10-28）：正確率 95%，⚠️ 80~94%、🔥 <80%
  const WRONG_ACC_TARGET = 95, WRONG_ACC_WARN = 80;
  function accStatus(pct, target, warn){
    target = target || ACC_TARGET; warn = warn || 60;
    if(pct===null || pct===undefined) return {color:"#9a9488", icon:"—", label:"尚無記錄"};
    if(pct>=target) return {color:"#3F7D5C", icon:"✅", label:"達標"};
    if(pct>=warn) return {color:"#A8631F", icon:"⚠️", label:"加強中"};
    return {color:"#B9554A", icon:"🔥", label:"待加強"};
  }

  /* ---------- storage (localStorage) ---------- */
  const NS = "ohs_";

  }
  function saveData(key, value){

  let state = {

    // 題庫（乙級40章）每次載入都整批用「種子資料＋questions.js（EXTERNAL_QUESTIONS，
    // GitHub Pages最新版）」重建，不再用舊版「只累加新id」的合併方式——累加式合併
    // 只會加、永遠不會減，裝置一旦看過某個題目id，就算之後題庫端把它刪掉/清重複，
    // 這個裝置的本機快取還是會留著它，導致每台裝置的題數停留在各自第一次看到的

    const prevQuestions = loadData("questions", []);
    const customQs = prevQuestions.filter(q=>q.id && !q.id.includes("-"));
    // 重複題清理後保留下來、原本沒章節的乙級考古題，沿用被移除那題的章節
    const examBSrc = (Array.isArray(window.EXAM_B_QUESTIONS) ? window.EXAM_B_QUESTIONS : [])

    const librarySources = [

    saveData("questions", state.questions);

    state.wrongMap = loadData("wrongMap", {});

    state.examA = dedupeById([window.EXAM_A_QUESTIONS, window.EXAM_A_QUESTIONS_2].filter(Array.isArray).flat()).filter(notDupQ);

  function recordWrongMapOutcome(id, correct){
    const m = state.wrongMap;
    const now = new Date().toISOString();
    if(!correct){
      const existing = m[id]||{wrongCount:0, correctStreak:0};
      const wrongCount = existing.wrongCount+1;
      const intervalDays = [1,3,7,14][Math.min(wrongCount-1,3)];
      const due = new Date(); due.setDate(due.getDate()+intervalDays);
      // 再錯一次：連續答對次數歸零，等級（wrongCount）提升，錯題本卡片會用顏色標示需要加強
      // 保留錯題本章節練習／全章節隨機的作答累計（cN/cC/xN/xC），錯題本的刷題率、正確率才不會因再錯一次而歸零
      m[id] = {...existing, wrongCount, correctStreak:0, lastSeen:todayStr(), updatedAt:now, dueDate:due.toISOString().slice(0,10), mastered:false};
    } else if(m[id]){
      const correctStreak = (m[id].correctStreak||0)+1;
      if(correctStreak>=3){
        // 連續答對 3 次，移出錯題本（mastered）
        m[id] = {...m[id], correctStreak, mastered:true, lastSeen:todayStr(), updatedAt:now};
      } else {
        const due = new Date(); due.setDate(due.getDate()+3);
        m[id] = {...m[id], correctStreak, dueDate:due.toISOString().slice(0,10), updatedAt:now};
      }
    }
    persist("wrongMap");
  }

      const [key,icon,label,badge] = it;
      return `<button class="nav-btn ${state.tab===key?'active':''}" data-tab="${key}">
        <span class="nav-icon">${icon}${badge?`<span class="nav-badge">${badge}</span>`:''}</span>
        <span style="font-size:11px;margin-top:2px;">${label}</span>
      </button>`;
    }).join("")}</nav>`;
  }

  function renderTab(doneCount,progressPct){
    if(state.tab==="dashboard") return renderDashboard(doneCount,progressPct);
    if(state.tab==="chapters") return renderChapters();
    if(state.tab==="bank") return renderBank();
    if(state.tab==="quiz") return renderQuiz();
    if(state.tab==="wrong") return renderWrong();
    if(state.tab==="numeric") return renderNumeric();
    if(state.tab==="examA") return renderExamA();
    if(state.tab==="examB") return renderExamB();
    if(state.tab==="laws") return renderLaws();
    if(state.tab==="sync") return renderSync();
    return "";
  }

  /* ---------- Dashboard ---------- */
  function renderDashboard(doneCount,progressPct){
    const d = daysUntil(state.examDate);
    const studiedToday = !!state.studyLog[todayStr()];
    let streak=0, cursor=new Date();
    while(true){
      const key=cursor.toISOString().slice(0,10);
      if(state.studyLog[key]){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
    }
    const remaining = CHAPTERS.length - doneCount;
    let suggestion;
    if(!state.examDate) suggestion = "先在上方設定考試日期，才能算出每日進度建議。";
    else if(d<=0) suggestion = "考試日已到或已過，請依現況調整。";
    else if(remaining>0){
      const perDay = Math.max(1, Math.ceil(remaining/Math.max(1,d-14)));
      suggestion = `建議扣除考前 14 天衝刺期，剩餘 ${Math.max(d-14,1)} 天讀完 ${remaining} 個章節，平均每 ${perDay} 天完成 1 章。`;
    } else suggestion = "章節已全部讀完，接下來請把每天的時間集中在「練習」與「錯題本」上。";

    const dueWrongCount = computeWrongQuestions().length;

    return `
      ${renderOverview()}
      <div class="card-row">
        ${statCard("章節進度", `${doneCount} / ${CHAPTERS.length}`, `${progressPct}%`)}
        ${statCard("題庫題數", state.questions.length, "累積收錄")}
        ${statCard("待複習錯題", dueWrongCount, "待複習", dueWrongCount>0)}
        ${statCard("連續讀書", streak, "天")}
      </div>
      <div class="suggestion-card">
        <div class="suggestion-title">今日讀書建議</div>
        <div class="suggestion-body">${esc(suggestion)}</div>
        <button class="primary-btn" id="markTodayBtn" style="margin-top:12px;" ${studiedToday?'disabled':''}>${studiedToday?'今天已打卡 ✓':'今天讀完了，打卡'}</button>
      </div>
      <div class="quick-row">
        <button class="quick-btn" data-goto="chapters"><div class="quick-icon">▤</div><div>章節清單</div></button>
        <button class="quick-btn" data-goto="bank"><div class="quick-icon">✎</div><div>輸入考古題</div></button>
        <button class="quick-btn" data-goto="quiz"><div class="quick-icon">▶</div><div>開始練習</div></button>
      </div>
      <div class="tip-box">
        <div class="tip-title">建議讀書節奏（每天 1 小時內）</div>
        <ul class="tip-list">
          <li>30 分鐘：讀新章節 / 複習筆記</li>
          <li>20 分鐘：在「題庫」做該章節的練習題</li>
          <li>10 分鐘：複習「錯題本」中今天到期的題目</li>
        </ul>
        <div style="margin-top:10px;font-size:13px;color:#6b6356;">
          考古題來源建議：勞動部勞動力發展署技能檢定中心「學科題庫下載」
          （techbank.wdasec.gov.tw，職類代碼 22200 職業安全衛生管理乙級）。
          下載 PDF 後，把題目逐題貼到「題庫」分頁即可建立你自己的練習庫。
        </div>
      </div>
    `;
  }
  function statCard(label,value,sub,accent){
    return `<div class="stat-card ${accent?'accent':''}">
      <div class="stat-label">${esc(label)}</div>
      <div class="stat-value">${esc(String(value))}</div>
      <div class="stat-sub">${esc(sub)}</div>
    </div>`;
  }

  /* ---------- Chapters ---------- */
  // 該章節累計正確率：把quizHistory裡標記這個章節的每一輪成績加總（跟renderChapterHistory用的是同一份資料，這裡做總和而非列表）
  function computeChapterAccuracy(chapterId){
    let correct=0, total=0;
    state.quizHistory.forEach(h=>{ if(h.chapter===chapterId){ correct+=h.correct; total+=h.total; } });
    return {correct, total, pct: total>0 ? Math.round(correct/total*100) : null};
  }
  // 畫一個環形進度圖（SVG，不用外部圖表套件）：中心顯示百分比數字，可傳入不同顏色代表覆蓋率/正確率
  function svgRing(pct, color, label){
    const size=92, stroke=10, r=(size-stroke)/2, c=size/2;
    const circumference = 2*Math.PI*r;
    const safePct = pct===null ? 0 : Math.max(0,Math.min(100,pct));
    const offset = circumference * (1-safePct/100);
    return `<div style="text-align:center;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto;">
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#EFE8DA" stroke-width="${stroke}"/>
        ${pct!==null ? `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-linecap="round" stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
          transform="rotate(-90 ${c} ${c})"/>` : ""}
        <text x="${c}" y="${c+6}" text-anchor="middle" font-size="19" font-weight="700" fill="#2B2620">${pct===null?'—':pct+'%'}</text>
      </svg>
      <div style="font-size:12px;color:#6b6356;margin-top:4px;">${esc(label)}</div>
    </div>`;
  }
  // 點擊章節後展開的互動式數據圖：刷題覆蓋率＋正確率兩個環形圖，加上最近幾輪成績的長條圖（可以看趨勢）
  function renderChapterChart(chapterId){
    const total = state.questions.filter(q=>q.chapter===chapterId).length;
    const seenCount = state.questions.filter(q=>q.chapter===chapterId && state.quizSeenIds[q.id]).length;
    const coveragePct = total>0 ? Math.round(seenCount/total*100) : null;
    const acc = computeChapterAccuracy(chapterId);
    let accColor="#9a9488", accLabel="尚無作答記錄";
    if(acc.pct!==null){
      if(acc.pct>=80){ accColor="#3F7D5C"; accLabel="✅ 已熟練"; }
      else if(acc.pct>=50){ accColor="#A8631F"; accLabel="⚠️ 加強中"; }
      else { accColor="#B9554A"; accLabel="🔥 待加強"; }
    }
    const history = state.quizHistory.filter(h=>h.chapter===chapterId).slice(0,8).reverse();
    const trend = history.length===0 ? `<div class="section-desc" style="margin-top:8px;">還沒有這個章節的作答記錄，開始練習後這裡會出現趨勢圖。</div>` : `
      <div style="font-size:12px;color:#6b6356;margin-top:14px;margin-bottom:6px;">最近 ${history.length} 輪正確率趨勢（由左到右依時間排序）</div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:70px;">
        ${history.map(h=>{
          const pct = h.total>0 ? Math.round(h.correct/h.total*100) : 0;
          const barColor = pct>=80?"#3F7D5C":pct>=50?"#A8631F":"#B9554A";
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
            <div style="font-size:10px;color:#6b6356;margin-bottom:2px;">${pct}%</div>
            <div style="width:100%;max-width:22px;height:${Math.max(4,pct*0.5)}px;background:${barColor};border-radius:4px 4px 0 0;"></div>
          </div>`;
        }).join("")}
      </div>
      <div style="display:flex;gap:6px;margin-top:4px;">
        ${history.map(h=>`<div style="flex:1;text-align:center;font-size:9px;color:#9a9488;max-width:22px;margin:0 auto;">${esc(h.date.slice(5))}</div>`).join("")}
      </div>
    `;
    return `<div class="chapter-chart" style="background:#fff;border:1px solid #E7E1D4;border-radius:14px;padding:16px;margin-top:-4px;">
      <div style="display:flex;justify-content:space-around;">
        ${svgRing(coveragePct, "#A8631F", `刷題進度 ${seenCount}/${total} 題`)}
        ${svgRing(acc.pct, accColor, acc.pct===null ? accLabel : `${accLabel}（${acc.correct}/${acc.total}題）`)}
      </div>
      ${trend}
    </div>`;
  }
  function renderChapters(){
    return `
      <div class="section-title">章節清單（共 ${CHAPTERS.length} 章）</div>
      <div class="section-desc">點一下狀態標籤可循環切換：未讀 → 閱讀中 → 已完成；點一下章節標題可以看刷題數據圖</div>
      ${CHAPTERS.map(c=>{
        const st = state.chapterState[c.id]?.status||"todo";
        const s = STATUS[st];
        const notes = state.chapterState[c.id]?.notes||"";
        const expanded = state.chartExpandedChapter===c.id;
        return `<div class="chapter-card">
          <div class="chapter-top">
            <div class="chapter-idx">第${toChinese(c.id)}章</div>
            <button class="status-pill" data-cycle="${c.id}" style="color:${s.color};background:${s.bg};">${s.label}</button>
          </div>
          <div class="chapter-title" data-chartexpand="${c.id}" style="cursor:pointer;">${esc(c.title)} <span style="font-size:12px;color:#A8631F;">${expanded?'📊 收合':'📊 查看數據'}</span></div>
          <div class="chapter-pages">P.${c.pages}</div>
          <textarea class="notes-area" placeholder="重點筆記（選填）" data-notes="${c.id}">${esc(notes)}</textarea>
        </div>
        ${expanded ? renderChapterChart(c.id) : ""}`;
      }).join("")}
    `;
  }

  function answerDisplay(q){
    const t = q.type||"single";
    if(t==="single") return q.options[q.answer];
    if(t==="multi") return q.answer.map(i=>q.options[i]).join("、");
    return q.answer;
  }
  // 作答後一律顯示「正確答案＋詳解」：詳解來自 explanations.js（以題目 id 對應，數字填空題沿用原題 id），
  // 沒有詳解時改顯示題目原本的備註。選項已在出題時打亂，所以答案代號以目前畫面上的順序計算。
  function renderExplain(q){
    const t = q.type||"single";
    let ans;
    if(t==="single") ans = `(${String.fromCharCode(65+q.answer)}) ${q.options[q.answer]}`;
    else if(t==="multi") ans = q.answer.map(i=>`(${String.fromCharCode(65+i)}) ${q.options[i]}`).join("、");
    else if(t==="truefalse") ans = String(q.answer)==="true" ? "○ 正確" : "✕ 錯誤";
    else ans = String(q.answer);
    const ex = (window.EXPLANATIONS && window.EXPLANATIONS[String(q.id||"").replace(/^num-/,"")]) || "";
    const note = (q.note||"").trim();
    const T = window.STUDY_TIPS;
    const tipKeys = (T && T.map && T.map[String(q.id||"").replace(/^num-/,"")]) || [];
    const tips = tipKeys.map(k=>T.topics[k]).filter(Boolean);
    return `<div class="quiz-explain">
      <div class="quiz-explain-ans">✅ 正確答案：${esc(ans)}</div>
      ${ex ? `<div class="quiz-explain-title">📖 詳解</div><div class="quiz-explain-body">${esc(ex)}</div>` : ""}
      ${note ? `<div class="quiz-explain-title">${ex?"📝 備註":"📖 詳解"}</div><div class="quiz-explain-body">${esc(note)}</div>` : ""}
      ${tips.map(t=>`<div class="quiz-explain-title">💡 ${esc(t.title)}</div><div class="quiz-explain-body">${esc(t.body)}</div>`).join("")}
      ${!ex && !note && !tips.length ? `<div style="color:#9a9488;">（本題詳解整理中）</div>` : ""}
    </div>`;
  }

  /* ---------- Bank ---------- */
  function renderBank(){
    const fc = state.bankFilterChapter;
    const filtered = fc==="all" ? state.questions : state.questions.filter(q=>q.chapter===fc);
    return `
      <div class="section-title">題庫管理</div>
      <div class="section-desc">把考古題（學科選擇題）整理成這裡的格式，之後就能在「練習」分頁隨機作答，答錯會自動進「錯題本」。</div>
      <div class="toggle-row">
        <button class="toggle-btn ${state.bankMode==='manual'?'active':''}" data-bankmode="manual">單題輸入</button>
        <button class="toggle-btn ${state.bankMode==='bulk'?'active':''}" data-bankmode="bulk">批次貼上</button>
      </div>
      ${state.bankMode==='manual' ? renderBankManual() : renderBankBulk()}
      <div class="section-title">已收錄題目（${filtered.length}）</div>
      <select id="bankFilterSelect" class="text-input">
        <option value="all" ${fc==='all'?'selected':''}>全部章節</option>
        ${CHAPTERS.map(c=>`<option value="${c.id}" ${fc===c.id?'selected':''}>${c.id===0?'概論':('第'+toChinese(c.id)+'章')} ${esc(c.title)}</option>`).join("")}
      </select>
      ${filtered.length===0 ? `<div class="empty-hint">目前還沒有題目，先用上面的方式新增吧。</div>` : ""}
      ${filtered.map(q=>`<div class="q-item">
        <div class="q-chapter">${q.chapter===0?'概論':('第'+toChinese(q.chapter)+'章')}</div>
        <div class="q-text">${esc(q.text)}</div>
        <div class="q-answer">正解：${esc(answerDisplay(q))}</div>
        <button class="delete-btn" data-delq="${q.id}">刪除</button>
      </div>`).join("")}
    `;
  }
  function renderBankManual(){
    const d = state.bankDraft;
    return `<div class="form-card">
      <label class="label">章節</label>
      <select id="draftChapter" class="text-input">
        ${CHAPTERS.map(c=>`<option value="${c.id}" ${d.chapter===c.id?'selected':''}>第${c.id}章 ${esc(c.title)}</option>`).join("")}
      </select>
      <label class="label">題目</label>
      <textarea id="draftText" class="text-area" placeholder="貼上題目文字">${esc(d.text)}</textarea>
      ${d.options.map((opt,i)=>`<div class="option-row">
        <input type="radio" name="draftAnswer" ${d.answer===i?'checked':''} data-draftans="${i}">
        <input class="option-input" data-draftopt="${i}" placeholder="選項 ${'ABCD'[i]}" value="${esc(opt)}">
      </div>`).join("")}
      <div style="font-size:12px;color:#9a9488;margin-bottom:8px;">點選圓圈標記正確答案</div>
      <button class="primary-btn" id="addManualBtn">新增到題庫</button>
    </div>`;
  }
  function renderBankBulk(){
    const fc = state.bankFilterChapter==='all'?1:state.bankFilterChapter;
    return `<div class="form-card">
      <label class="label">匯入到章節</label>
      <select id="bulkChapterSelect" class="text-input">
        ${CHAPTERS.map(c=>`<option value="${c.id}" ${fc===c.id?'selected':''}>第${c.id}章 ${esc(c.title)}</option>`).join("")}
      </select>
      <div style="font-size:13px;color:#6b6356;margin:8px 0;">每題一段，題目與選項各佔一行，最後一行寫答案（1-4 或 A-D），題與題之間空一行。例如：</div>
      <pre class="example-block">下列何者非屬危險性機械？
1) 固定式起重機
2) 升降機
3) 堆高機
4) 鍋爐
3</pre>
      <textarea id="bulkText" class="text-area" style="min-height:160px;" placeholder="把多題考古題貼在這裡">${esc(state.bankBulkText)}</textarea>
      <button class="primary-btn" id="bulkImportBtn">批次匯入</button>
      ${state.bankBulkMsg ? `<div class="bulk-msg">${esc(state.bankBulkMsg)}</div>` : ""}
    </div>`;
  }

  /* ---------- Quiz ---------- */
  function renderQuiz(){
    if(state.questions.length===0){
      return `<div class="empty-hint">題庫目前是空的，請先到「題庫」分頁新增考古題再來練習。</div>`;
    }
    if(state.quizPool.length>0 && state.quizMode==="numeric"){
      return `<div class="result-card">🔢 目前有一輪「數字填空」進行中（第 ${state.quizIdx+1} / ${state.quizPool.length} 題）。</div>
        <button class="primary-btn" data-goto="numeric">前往數字題分頁繼續作答</button>`;
    }
    if(state.quizPool.length>0 && state.quizMode==="examAwrong"){
      return `<div class="result-card">🅰 目前有一輪「甲業錯題複習」進行中（第 ${state.quizIdx+1} / ${state.quizPool.length} 題）。</div>
        <button class="primary-btn" data-goto="examA">前往甲種分頁繼續作答</button>`;
    }
    if(state.quizPool.length===0){
      const chapterSelected = state.quizChapterFilter!=="all";
      return `
        <div class="section-title">開始練習</div>
        <label class="label">選擇範圍</label>
        <select id="quizChapterSelect" class="text-input">
          <option value="all">全部章節（${state.questions.length} 題）</option>
          ${CHAPTERS.map(c=>{
            const n = state.questions.filter(q=>q.chapter===c.id).length;
            return `<option value="${c.id}" ${n===0?'disabled':''} ${state.quizChapterFilter===c.id?'selected':''}>${c.id===0?'概論':('第'+toChinese(c.id)+'章')} ${esc(c.title)}（${n} 題）</option>`;
          }).join("")}
        </select>
        <div class="section-desc" style="margin-top:4px;">單一章節每輪以 50 題為單位出題（不滿 50 題則刷完該章全部題目），優先出還沒刷過的題目，刷完一輪才會重複。</div>
        <button class="primary-btn" id="startQuizBtn">開始隨機練習</button>
        <button class="primary-btn" id="startRandom20Btn" style="margin-top:8px;background:#2f6b4f;">🎲 綜合隨機 20 題（跨章節測驗）</button>
        ${state.quizStats.total>0 ? `<div class="result-card">上一輪結果：${state.quizStats.correct} / ${state.quizStats.total} 答對</div>` : ""}
        ${chapterSelected ? renderChapterCoverage(state.quizChapterFilter) : ""}
        ${chapterSelected ? renderChapterHistory(state.quizChapterFilter) : renderQuizHistory()}
      `;
    }
    const current = state.quizPool[state.quizIdx];
    const qtype = current.type || "single";
    return `
      <div class="quiz-progress">第 ${state.quizIdx+1} / ${state.quizPool.length} 題 · 答對 ${state.quizStats.correct}</div>
      <div class="quiz-card">
        <div class="quiz-chapter-tag">${current.chapter===0?'概論':('第'+toChinese(current.chapter)+'章')}${qtype==='multi'?' · 複選題':qtype==='fill'?' · 填空題':qtype==='truefalse'?' · 是非題':''}</div>
        <div class="quiz-question">${esc(current.text)}</div>
        ${qtype==='single' ? renderSingleOptions(current) : ""}
        ${qtype==='multi' ? renderMultiOptions(current) : ""}
        ${qtype==='fill' ? renderFillInput(current) : ""}
        ${qtype==='truefalse' ? renderTrueFalseOptions(current) : ""}
        ${state.quizRevealed ? renderExplain(current) : ""}
        ${state.quizRevealed ? `<button class="primary-btn" id="nextQuizBtn">${state.quizIdx+1<state.quizPool.length?'下一題':'完成本輪'}</button>` : ""}
      </div>
      <button class="primary-btn" id="quizExitBtn" style="background:#8a8275;margin-top:8px;">🚪 先停在這裡（已作答的都會記錄，下次可換範圍或接續）</button>
      <div class="section-desc" style="margin-top:6px;">中途關閉分頁或切走也沒關係，回來會自動接續這一題。</div>
    `;
  }
  function renderQuizHistory(){
    const list = state.quizHistory.filter(h=>h.chapter==null && h.mode!=="numeric");
    if(list.length===0) return "";
    const rows = list.slice(0,10).map(h=>{
      const pct = h.total>0 ? Math.round(h.correct/h.total*100) : 0;
      return `<div class="wrong-top" style="justify-content:space-between;">
        <span class="q-chapter">${esc(h.date)}</span>
        <span>${h.correct} / ${h.total} 答對（${pct}%）</span>
      </div>`;
    }).join("");
    return `<div class="section-title" style="margin-top:18px;">綜合隨機測驗成績記錄</div>${rows}`;
  }
  // 單一章節的刷題覆蓋率：已刷過（作答過）幾題／該章節總題數
  function renderChapterCoverage(chapterId){
    const total = state.questions.filter(q=>q.chapter===chapterId).length;
    const seenCount = state.questions.filter(q=>q.chapter===chapterId && state.quizSeenIds[q.id]).length;
    const pct = total>0 ? Math.round(seenCount/total*100) : 0;
    return `<div class="result-card" style="margin-top:8px;">本章節刷題進度：已刷過 ${seenCount} / ${total} 題（${pct}%）</div>`;
  }
  // 單一章節自己的成績歷史（依日期），用來追蹤該章節熟練度趨勢
  function renderChapterHistory(chapterId){
    const list = state.quizHistory.filter(h=>h.chapter===chapterId);
    if(list.length===0) return "";
    const rows = list.slice(0,10).map(h=>{
      const pct = h.total>0 ? Math.round(h.correct/h.total*100) : 0;

        <span class="q-chapter">${esc(h.date)}</span>

  }
  function renderSingleOptions(current){
    return current.options.map((opt,i)=>{
      let cls="quiz-option";

  function renderMultiOptions(current){

  function renderFillInput(current){
    // 數字填空題：顯示把數字挖空後的格式提示（單位照給），只有一個數字時手機直接跳數字鍵盤

    const input = hint + `<input class="text-input" id="fillInput" placeholder="${current.numeric?'輸入數字':'輸入答案'}" ${numCount===1?'inputmode="decimal"':''} autocomplete="off" value="${esc(state.quizFillInput)}" ${state.quizRevealed?'disabled':''} style="margin-bottom:10px;font-size:18px;">`;
    const submit = !state.quizRevealed ? `<button class="primary-btn" id="fillSubmitBtn" style="margin-bottom:10px;">提交答案</button>` : "";
    const result = state.quizRevealed ? `<div class="q-answer" style="margin-bottom:10px;">正確答案：${esc(current.answer)}　${state.quizFillCorrect?'（你答對了 ✓）':'（你的答案：'+esc(state.quizFillInput||'（空白）')+'）'}</div>` : "";
    return input + submit + result;

  function renderTrueFalseOptions(current){
    const choices = [{label:"○ 正確", value:"true"}, {label:"✕ 錯誤", value:"false"}];
    return choices.map(c=>{
      let cls="quiz-option";

      return `<button class="${cls}" data-choose="${c.value}" ${state.quizRevealed?'disabled':''}>
        <span class="quiz-option-label" style="font-size:15px;">${c.value==="true"?"○":"✕"}</span>${c.label.split(" ").slice(1).join(" ")}
      </button>`;

  }

  /* ---------- Wrong book ---------- */
  function idToQuestionMap(){
    const map = {};
    state.questions.forEach(q=>{ map[q.id]=q; });
    state.examA.forEach(q=>{ map[q.id]=q; });
    state.examB.forEach(q=>{ map[q.id]=q; });
    state.numeric.forEach(q=>{ map[q.id]=q; });
    return map;
  }
  function bucketKey(q){
    if(q.id && q.id.startsWith('num-')) return 'num';
    if(q.id && q.id.startsWith('examA')) return 'examA';
    if(q.id && q.id.startsWith('examB')) return 'examB';
    return q.chapter;
  }
  function bucketLabel(key){
    if(key==='num') return '數字填空';
    if(key==='examA') return '甲業題庫';
    if(key==='examB') return '乙級考古題';
    const n = parseInt(key,10);
    return n===0 ? '概論' : ('第'+toChinese(n)+'章');
  }
  function bucketTitle(key){
    if(key==='num') return '數字填空題庫（不給選項，直接輸入數字）';
    if(key==='examA') return '一般甲業模擬題庫';
    if(key==='examB') return '22200職業安全衛生管理乙級學科考古題';
    const n = parseInt(key,10);
    return n===0 ? '職業安全概論（基礎概念）' : ((CHAPTERS.find(ch=>ch.id===n)||{}).title || "");
  }
  // 2026-10-14 拆出「甲業錯題本」：甲種題庫（examA*）及由甲種題庫轉出的數字填空題（num-examA*）
  // 另外放，乙級錯題本（預設）不再顯示。只是篩選顯示，wrongMap 記錄本身不動，答題進度與雲端同步照舊。
  function isExamABookId(id){ return String(id).replace(/^num-/,'').startsWith('examA'); }
  function inWrongBook(id, book){ return (book==='examA') === isExamABookId(id); }
  function computeWrongStats(book){
    book = book || 'main';
    const qmap = idToQuestionMap();
    const byBucket = {};
    let totalAll=0, masteredAll=0;
    Object.keys(state.wrongMap).forEach(qid=>{
      const q = qmap[qid];
      if(!q || !inWrongBook(qid, book)) return;
      const key = bucketKey(q);
      const meta = state.wrongMap[qid];
      if(!byBucket[key]) byBucket[key] = {total:0, mastered:0};
      byBucket[key].total++; totalAll++;
      if(meta.mastered){ byBucket[key].mastered++; masteredAll++; }
    });
    return {byBucket, totalAll, masteredAll};
  }
  function renderWrongStats(book){
    const {byBucket, totalAll, masteredAll} = computeWrongStats(book);
    if(totalAll===0) return "";
    const overallPct = Math.round(masteredAll/totalAll*100);
    const rows = Object.keys(byBucket)
      .sort((a,b)=>(byBucket[a].mastered/byBucket[a].total)-(byBucket[b].mastered/byBucket[b].total))
      .map(key=>{
        const s = byBucket[key];
        const pct = Math.round(s.mastered/s.total*100);
        return `<div class="wrong-top" style="justify-content:space-between;">
          <span class="q-chapter">${bucketLabel(key)} ${esc(bucketTitle(key))}</span>
          <span>${s.mastered} / ${s.total} 已熟記（${pct}%）</span>
        </div>`;
      }).join("");
    return `
      <div class="section-desc" style="margin-top:4px;">整體錯題完成率：${masteredAll} / ${totalAll}（${overallPct}%）已熟記</div>
      <div class="sub-title">各章節完成率（由弱到強排序，方便針對不熟章節加強）</div>
      ${rows}
    `;
  }
  function computeWrongQuestions(book){
    book = book || 'main';
    const qmap = idToQuestionMap();
    // 不依複習日排程，改依「容易錯」優先：答錯次數越多排越前面；次數相同時，離熟記越遠（連續答對次數越少）的優先
    return Object.keys(state.wrongMap)
      .filter(id=>qmap[id] && !state.wrongMap[id].mastered && inWrongBook(id, book))
      .map(id=>({...qmap[id], meta:state.wrongMap[id]}))
      .sort((a,b)=>(b.meta.wrongCount||0)-(a.meta.wrongCount||0) || (a.meta.correctStreak||0)-(b.meta.correctStreak||0));
  }
  // 2026-10-17「已學會錯題本」：乙級錯題本中連續答對 3 次（或手動按已熟記）的題目（wrongMap.mastered），
  // 不再從錯題本消失，而是集中在這裡隨時抽考；依答錯次數由多到少排序、出題，次數相同時最久沒考的優先。
  // 在這裡又答錯，會自動回到乙級錯題本（mastered 改回 false、連續答對歸零）。甲業題目不列入。
  function computeLearnedQuestions(){
    const qmap = idToQuestionMap();
    return Object.keys(state.wrongMap)
      .filter(id=>qmap[id] && state.wrongMap[id].mastered && !isExamABookId(id) && isActiveQ(qmap[id]))
      .map(id=>({...qmap[id], meta:state.wrongMap[id]}))
      .sort((a,b)=>(b.meta.wrongCount||0)-(a.meta.wrongCount||0) || String(a.meta.updatedAt||'').localeCompare(String(b.meta.updatedAt||'')));
  }
  // 2026-10-27 乙級錯題本依章節分類：章節練習題、考古題、數字題都用題目本身的章節，沒有章節的歸「未分章」。
  // 刷題率＝該章「待複習」錯題中，在錯題本章節練習做過至少一次的比例（沒有待複習的題目＝100%）；
  // 正確率＝該章錯題（含已學會）在錯題本章節練習的累計答對率。全章節隨機 20 題用 xN/xC 另外算。
  function wrongChKey(q){ return q.chapter!=null ? String(q.chapter) : 'none'; }
  function wrongChLabel(key){ return key==='none' ? '未分章' : bucketLabel(key); }
  function wrongChTitle(key){ return key==='none' ? '考古題／數字題（無對應章節）' : bucketTitle(key); }
  function wrongProg(list, nK, cK){
    const pending = list.filter(q=>!q.meta.mastered);
    const seen = pending.filter(q=>(q.meta[nK]||0)>0).length;
    let accC=0, accT=0;
    list.forEach(q=>{ accT+=q.meta[nK]||0; accC+=q.meta[cK]||0; });
    const total = pending.length;
    return {seen, total, cov: total>0?Math.round(seen/total*100):100, accC, accT, acc: accT>0?Math.round(accC/accT*100):null};
  }
  function wrongReached(p){ return p.total===0 || (p.cov>=100 && p.acc!==null && p.acc>=WRONG_ACC_TARGET); }
  function computeWrongChapters(){
    const qmap = idToQuestionMap();
    const groups = {}, all = [];
    Object.keys(state.wrongMap).forEach(id=>{
      const q = qmap[id];
      if(!q || isExamABookId(id) || !isActiveQ(q)) return;
      const item = {...q, meta:state.wrongMap[id]};
      const k = wrongChKey(q);
      (groups[k] = groups[k] || []).push(item);
      all.push(item);
    });
    const chapters = Object.keys(groups)
      .sort((a,b)=>(a==='none'?999:parseInt(a,10))-(b==='none'?999:parseInt(b,10)))
      .map(key=>{
        const list = groups[key];
        const pending = list.filter(q=>!q.meta.mastered)
          .sort((a,b)=>(b.meta.wrongCount||0)-(a.meta.wrongCount||0) || (a.meta.correctStreak||0)-(b.meta.correctStreak||0));
        return {key, pending, learned:list.length-pending.length, prog:wrongProg(list,'cN','cC')};
      });
    return {chapters, chAll:wrongProg(all,'cN','cC'), mix:wrongProg(all,'xN','xC'), pendingAll:all.filter(q=>!q.meta.mastered)};
  }
  function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function wrongReviewTitle(current){
    if(state.wrongBook==='learned' && !current._rv) return '已學會錯題抽考';
    if(current._rv==='mix') return '全章節錯題隨機';
    if(current._rv==='ch') return wrongChLabel(current._rvCh)+' 錯題加強';
    return '錯題複習';
  }
  // 錯題複習作答畫面：乙級錯題本／已學會（錯題本分頁）與甲業錯題本（甲種分頁）共用
  function renderWrongReview(title){
      const current = state.quizPool[state.quizIdx];
      const qtype = current.type || "single";
      return `
        <div class="quiz-progress">🔁 ${title} 第 ${state.quizIdx+1} / ${state.quizPool.length} 題 · 答對 ${state.quizStats.correct}</div>
        <div class="quiz-card">
          <div class="quiz-chapter-tag">${esc(bucketLabel(bucketKey(current)))}${qtype==='multi'?' · 複選題':qtype==='fill'?' · 填空題':qtype==='truefalse'?' · 是非題':''}</div>
          <div class="quiz-question">${esc(current.text)}</div>
          ${qtype==='single' ? renderSingleOptions(current) : ""}
          ${qtype==='multi' ? renderMultiOptions(current) : ""}
          ${qtype==='fill' ? renderFillInput(current) : ""}
          ${qtype==='truefalse' ? renderTrueFalseOptions(current) : ""}
          ${state.quizRevealed ? renderExplain(current) : ""}
          ${state.quizRevealed ? `<button class="primary-btn" id="nextQuizBtn">${state.quizIdx+1<state.quizPool.length?'下一題':'完成本輪'}</button>` : ""}
        </div>
        <button class="primary-btn" id="quizExitBtn" style="background:#8a8275;margin-top:8px;">🚪 先停在這裡（已作答的都會記錄，下次回來會接續）</button>
      `;
  }
  function wrongCard(q, book){
      const wc = q.meta.wrongCount||0;
      const streak = q.meta.correctStreak||0;
      const levelClass = wc>=3 ? ' level-high' : wc===2 ? ' level-mid' : '';
      const levelBadge = wc>=3 ? '<span class="wrong-level-badge high">🔥 重點加強</span>' : wc===2 ? '<span class="wrong-level-badge mid">⚠️ 加強複習</span>' : '';
      return `<div class="wrong-card${levelClass}">
        <div class="wrong-top">
          <span class="q-chapter">${bucketLabel(bucketKey(q))}</span>
          <span class="wrong-count">錯過 ${wc} 次</span>
          <span class="wrong-streak">${book==='learned' ? '✅ 已學會' : `連續答對 ${streak}/3`}</span>
          ${levelBadge}
        </div>
        <div class="q-text">${esc(q.text)}</div>
        <button class="toggle-btn" data-showans="${q.id}" style="width:auto;display:inline-block;padding:6px 12px;">顯示答案</button>
        <div class="q-answer" data-ansbox="${q.id}" style="display:none;">正解：${esc(answerDisplay(q))}</div>
        ${book==='learned' ? '' : `<button class="mastered-btn" data-mastered="${q.id}">${book==='examA'?'已熟記，移出甲業錯題本':'已熟記，移到已學會錯題本'}</button>`}
      </div>`;
  }
  function renderWrong(){
    if(state.quizPool.length>0 && state.quizMode==='wrongreview'){
      return renderWrongReview(wrongReviewTitle(state.quizPool[state.quizIdx]));
    }
    if(state.quizPool.length>0 && state.quizMode==='examAwrong'){
      return `<div class="result-card">🅰 目前有一輪「甲業錯題複習」進行中（第 ${state.quizIdx+1} / ${state.quizPool.length} 題）。</div>
        <button class="primary-btn" data-goto="examA">前往甲種分頁繼續作答</button>`;
    }
    // 2026-10-27 甲業錯題本移到「甲種」分頁獨立看，這裡只剩乙級錯題本／已學會
    const book = state.wrongBook==='learned' ? 'learned' : 'main';
    const counts = {main:computeWrongQuestions('main').length, learned:computeLearnedQuestions().length};
    const wq = book==='learned' ? computeLearnedQuestions() : computeWrongQuestions(book);
    function wrongTabs(){
      return [['main','乙級錯題本'],['learned','已學會']].map(([k,label])=>
        `<button class="toggle-btn ${book===k?'active':''}" data-wrongbook="${k}" style="padding:6px 0;font-size:12px;">${label}（${counts[k]}）</button>`).join("");
    }
    const card = q => wrongCard(q, book);
    if(book==='learned'){
      return `
      <div class="toggle-row" style="margin:0 0 10px;">${wrongTabs()}</div>
      <div class="section-title">已學會錯題本</div>
      <div class="section-desc">乙級錯題本裡連續答對 3 次的題目會移到這裡，方便隨時再抽考自己。抽考依「答錯次數」由多到少出題，錯越多次越優先（次數相同時，最久沒考的先出）。在這裡又答錯的題目，會自動回到乙級錯題本重新累計連續答對。</div>
      ${wq.length>0 ? `<button class="primary-btn" id="startWrongReviewBtn" style="margin-bottom:14px;">🎯 開始已學會錯題抽考（本輪 ${Math.min(20,wq.length)} 題，錯越多次越先出）</button>` : ""}
      <div class="sub-title">已學會錯題（${wq.length}，依錯誤次數排序）</div>
      ${wq.length===0?`<div class="empty-hint">目前還沒有已學會的錯題，錯題本的題目連續答對 3 次就會移過來。</div>`:""}
      ${wq.map(q=>card(q)).join("")}
    `;
    }
    // 2026-10-27 乙級錯題本改成章節分類：① 每章獨立加強 → ② 全章節隨機 20 題，兩關都達標才算錯題練好
    const wc = computeWrongChapters();
    const chs = wc.chapters.filter(c=>c.pending.length>0 || c.learned>0);
    const chReached = chs.filter(c=>wrongReached(c.prog)).length;
    const stage1Done = chs.length>0 && chReached===chs.length;
    const mixDone = wrongReached(wc.mix);
    const allSt = accStatus(wc.chAll.acc, WRONG_ACC_TARGET, WRONG_ACC_WARN);
    // 章節排序（同總覽）：還沒有正確率記錄的章節，正確率排序時一律放最後
    const chNo = c=>c.key==='none' ? 999 : parseInt(c.key,10);
    const sorters = {
      chapter: (x,y)=>chNo(x)-chNo(y),
      cov: (x,y)=>x.prog.cov-y.prog.cov || chNo(x)-chNo(y),
      acc: (x,y)=>((x.prog.acc===null?101:x.prog.acc)-(y.prog.acc===null?101:y.prog.acc)) || chNo(x)-chNo(y),
    };
    const sorted = [...chs].sort(sorters[state.wrongSort]||sorters.chapter);
    const sortBtn = (key,label)=>`<button class="toggle-btn ${state.wrongSort===key?'active':''}" data-wrongsort="${key}" style="padding:6px 0;font-size:12px;">${label}</button>`;
    const lastRound = (state.quizMode==='wrongreview' && state.quizStats.total>0)
      ? `<div class="result-card">上一輪結果：${state.quizStats.correct} / ${state.quizStats.total} 答對</div>` : "";
    const chBlock = c=>{
      const open = state.wrongOpenCh===c.key;
      const n = c.pending.length;
      return `<div style="margin-bottom:6px;">
        ${overviewRow(wrongChLabel(c.key), `${wrongChTitle(c.key)}（待複習 ${n}・已學會 ${c.learned}）${wrongReached(c.prog)?' ✅':''}`, c.prog, `data-wrongview="${c.key}"`, WRONG_ACC_TARGET, WRONG_ACC_WARN)}
        <div class="toggle-row" style="margin:2px 0 0;">
          ${n>0 ? `<button class="toggle-btn active" data-wrongch="${c.key}" style="padding:6px 0;font-size:12px;">▶ 練這章（${Math.min(20,n)} 題）</button>` : `<button class="toggle-btn" disabled style="padding:6px 0;font-size:12px;">本章錯題都已學會</button>`}
          <button class="toggle-btn" data-wrongview="${c.key}" style="padding:6px 0;font-size:12px;">${open?'▲ 收起題目':'📋 看題目'}</button>

          ${svgRing(wc.chAll.acc, allSt.color, wc.chAll.acc===null ? "尚無作答記錄" : `${allSt.icon} 章節錯題正確率 ${wc.chAll.accC}/${wc.chAll.accT}`)}
        </div>
        <div class="ov-legend"><span><i style="background:#5B6B82;"></i>刷題率（目標100%）</span><span><i style="background:#3F7D5C;"></i>正確率（✅≥${WRONG_ACC_TARGET}% ⚠️${WRONG_ACC_WARN}~${WRONG_ACC_TARGET-1}% 🔥<${WRONG_ACC_WARN}%）</span><span><i class="ov-legend-target"></i>${WRONG_ACC_TARGET}%目標線</span></div>
        <div class="sub-title">練習流程</div>
        <div class="section-desc" style="margin-top:0;">① 各章節錯題加強：${chReached} / ${chs.length} 章達標 ${stage1Done?'✅':''}</div>
        ${overviewRow('② 全章節隨機', `20 題一輪${mixDone && wc.mix.total>0?' ✅':''}`, wc.mix, '', WRONG_ACC_TARGET, WRONG_ACC_WARN)}
        ${stage1Done && mixDone ? `<div class="result-card" style="font-weight:600;">🎉 各章節與全章節錯題都練好了！</div>` : ""}
        ${wc.pendingAll.length>0 ? `<button class="primary-btn" id="startWrongMixBtn" style="margin:10px 0 4px;${stage1Done?'':'background:#8a8275;'}">🎲 全章節錯題隨機 20 題</button>
        <div class="section-desc" style="margin-top:0;">${stage1Done?'各章節都已達標，現在用全章節隨機把錯題練到刷題 100%、正確率 '+WRONG_ACC_TARGET+'%。':'建議先把下面各章節練到達標（還差 '+(chs.length-chReached)+' 章），再來做全章節隨機。'}</div>` : ""}
        <div class="sub-title">各章節錯題（雙達標 ${chReached}/${chs.length} 章・${wc.pendingAll.length} 題待複習）</div>
        <div class="toggle-row" style="margin:6px 0 8px;">
          ${sortBtn('chapter','依章節')}${sortBtn('cov','刷題率低→高')}${sortBtn('acc','正確率低→高')}
        </div>
        <div class="section-desc" style="margin-top:0;">刷題＝這章待複習錯題在「練這章」做過的比例；正確＝這章錯題在「練這章」的答對率。每輪最多 20 題，沒練過的錯題優先出。點任一列可展開題目。</div>
        ${chs.length===0?`<div class="empty-hint">太好了，目前沒有需要複習的錯題。</div>`:""}
        ${sorted.map(chBlock).join("")}
      </div>
    `;
  }

  /* ---------- 數字填空 ---------- */
  // 數字分頁只出乙級來源的數字題；由甲種題庫轉出的（num-examA*）仍留在 state.numeric 供甲業錯題本對照，但不在這裡出題、計分
  function numericPoolB(){ return state.numeric.filter(q=>!isExamABookId(q.id)); }
  function computeNumericStats(){
    const pool = numericPoolB();
    const total = pool.length;
    const seen = pool.filter(q=>state.quizSeenIds[q.id]).length;
    let correct=0, answered=0;
    state.quizHistory.forEach(h=>{ if(h.mode==="numeric"){ correct+=h.correct; answered+=h.total; } });
    return {total, seen, coverage: total>0?Math.round(seen/total*100):0, correct, answered, acc: answered>0?Math.round(correct/answered*100):null};
  }
  function renderNumeric(){
    if(state.quizPool.length>0 && state.quizMode==="numeric"){
      const current = state.quizPool[state.quizIdx];
      return `
        <div class="quiz-progress">🔢 數字填空 第 ${state.quizIdx+1} / ${state.quizPool.length} 題 · 答對 ${state.quizStats.correct}</div>
        <div class="quiz-card">
          <div class="quiz-chapter-tag">${esc(current.origin||"")} · 數字填空</div>
          <div class="quiz-question">${esc(current.text)}</div>
          ${renderFillInput(current)}
          ${state.quizRevealed ? renderExplain(current) : ""}
          ${state.quizRevealed ? `<button class="primary-btn" id="nextQuizBtn">${state.quizIdx+1<state.quizPool.length?'下一題':'完成本輪'}</button>` : ""}
        </div>
        <button class="primary-btn" id="quizExitBtn" style="background:#8a8275;margin-top:8px;">🚪 先停在這裡（已作答的都會記錄）</button>
      `;
    }
    if(state.quizPool.length>0){
      const back = state.quizMode==="wrongreview" ? "wrong" : state.quizMode==="examAwrong" ? "examA" : "quiz";
      return `<div class="result-card">目前有一輪${state.quizMode==="wrongreview"?"錯題複習":state.quizMode==="examAwrong"?"甲業錯題複習":"練習"}還沒做完（第 ${state.quizIdx+1} / ${state.quizPool.length} 題），要先結束那一輪才能開始數字填空。</div>
        <button class="primary-btn" data-goto="${back}">回去繼續那一輪</button>
        <button class="primary-btn" id="quizExitBtn" style="background:#8a8275;margin-top:8px;">結束那一輪（已作答的都會記錄）</button>`;
    }
    const s = computeNumericStats();
    const st = accStatus(s.acc);
    const hist = state.quizHistory.filter(h=>h.mode==="numeric");
    return `
      <div class="section-title">🔢 數字填空題庫</div>
      <div class="section-desc">從乙級題庫（乙級40章、乙級考古題）自動挑出答案是數字的題目，例如年限、人數、公尺、分貝、比例。不給選項，直接輸入數字作答；會提示單位格式，只要數字對就算對。答錯一樣會進錯題本。</div>
      <div style="display:flex;justify-content:space-around;background:#fff;border:1px solid #E7E1D4;border-radius:14px;padding:14px;">
        ${svgRing(s.coverage, "#5B6B82", `刷題達成率 ${s.seen}/${s.total} 題`)}
        ${svgRing(s.acc, st.color, s.acc===null ? "尚無作答記錄" : `${st.icon} 正確率 ${s.correct}/${s.answered} 題`)}
      </div>
      <div class="section-desc" style="margin-top:0;">目標：刷題 100%、正確率 ${ACC_TARGET}%</div>
      <button class="primary-btn" id="startNumericBtn">開始數字填空（每輪 20 題，沒刷過的優先）</button>
      ${state.quizStats.total>0 && state.quizMode==="numeric" ? `<div class="result-card">上一輪結果：${state.quizStats.correct} / ${state.quizStats.total} 答對</div>` : ""}
      ${hist.length ? `<div class="section-title" style="margin-top:18px;">數字填空成績記錄</div>` + hist.slice(0,10).map(h=>{
        const pct = h.total>0 ? Math.round(h.correct/h.total*100) : 0;
        return `<div class="wrong-top" style="justify-content:space-between;"><span class="q-chapter">${esc(h.date)}</span><span>${h.correct} / ${h.total} 答對（${pct}%）</span></div>`;
      }).join("") : ""}
    `;
  }

  /* ---------- 總覽儀表板：全章節＆題庫的刷題率與正確率 ---------- */
  function sumHistory(list){
    let correct=0, total=0;
    list.forEach(h=>{ correct+=h.correct; total+=h.total; });
    return {correct, total, pct: total>0?Math.round(correct/total*100):null};
  }
  function overviewData(){
    const chapters = CHAPTERS.map(c=>{
      const qs = state.questions.filter(q=>q.chapter===c.id);
      const seen = qs.filter(q=>state.quizSeenIds[q.id]).length;
      const acc = computeChapterAccuracy(c.id);
      return {id:c.id, label:(c.id===0?'概論':'第'+toChinese(c.id)+'章'), title:c.title, total:qs.length, seen,
        cov: qs.length>0?Math.round(seen/qs.length*100):0, acc:acc.pct, accC:acc.correct, accT:acc.total};
    });
    const chTotal = chapters.reduce((a,c)=>a+c.total,0), chSeen = chapters.reduce((a,c)=>a+c.seen,0);
    const chAcc = sumHistory(state.quizHistory.filter(h=>h.mode!=="numeric"));
    const bSeen = state.examB.filter(q=>state.examBSeenIds[q.id]).length;
    const bAcc = sumHistory(state.examBHistory);
    const num = computeNumericStats();
    // 2026-10-27 起總覽只算乙級；甲種題庫的刷題率／正確率在「甲種」分頁獨立看
    const banks = [
      {key:"quiz", label:"乙級40章", total:chTotal, seen:chSeen, acc:chAcc.pct, accC:chAcc.correct, accT:chAcc.total},
      {key:"examB", label:"乙級考古題", total:state.examB.length, seen:bSeen, acc:bAcc.pct, accC:bAcc.correct, accT:bAcc.total},
      {key:"numeric", label:"數字填空", total:num.total, seen:num.seen, acc:num.acc, accC:num.correct, accT:num.answered},
    ].map(b=>({...b, cov: b.total>0?Math.round(b.seen/b.total*100):0}));
    // 整體：數字填空是從題庫衍生出來的，刷題數不重複計入；正確率則各來源的作答全部加總
    // 已分章的乙級考古題同時出現在「乙級40章」和「乙級考古題」，整體題數只算一次
    const overlap = state.examB.filter(q=>q.chapter!=null);
    const allTotal = chTotal + state.examB.length - overlap.length;
    const allSeen = chSeen + bSeen - overlap.filter(q=>state.quizSeenIds[q.id] && state.examBSeenIds[q.id]).length;
    const allC = chAcc.correct + bAcc.correct + num.correct;
    const allT = chAcc.total + bAcc.total + num.answered;
    return {chapters, banks, allTotal, allSeen, allCov: allTotal>0?Math.round(allSeen/allTotal*100):0,
      allAcc: allT>0?Math.round(allC/allT*100):null, allC, allT};
  }
  // 一列＝一個章節/題庫：上條「刷題率」、下條「正確率」，同一個 0~100% 刻度；正確率條上畫出目標線（ACC_TARGET）
  function overviewRow(label, title, item, attrs, target, warn){
    const st = accStatus(item.acc, target, warn);
    const tip = `已刷 ${item.seen}/${item.total} 題（${item.cov}%）；` + (item.acc===null ? "尚無正確率記錄" : `正確 ${item.accC}/${item.accT} 題（${item.acc}%）`);
    return `<div class="ov-row" ${attrs||""} title="${esc(tip)}">
      <div class="ov-label"><b>${esc(label)}</b> ${esc(title)} <span class="ov-go">›</span></div>
      <div class="ov-line"><span class="ov-k">刷題</span>
        <div class="ov-track"><div class="ov-fill" style="width:${item.cov}%;background:#5B6B82;"></div></div>
        <span class="ov-v">${item.cov}%</span></div>
      <div class="ov-line"><span class="ov-k">正確</span>
        <div class="ov-track">${item.acc===null?"":`<div class="ov-fill" style="width:${item.acc}%;background:${st.color};"></div>`}<div class="ov-target" ${target?`style="left:${target}%;"`:""}></div></div>
        <span class="ov-v">${item.acc===null?"—":st.icon+" "+item.acc+"%"}</span></div>
    </div>`;
  }
  function renderOverview(){
    const d = overviewData();
    const allSt = accStatus(d.allAcc);
    const sorters = {
      chapter: (a,b)=>a.id-b.id,
      // 還沒有正確率記錄的章節，不論低→高或高→低都排在最後（那些看刷題率排序比較準）
      acc: (a,b)=>((a.acc===null?101:a.acc)-(b.acc===null?101:b.acc)) || a.id-b.id,
      accDesc: (a,b)=>((b.acc===null?-1:b.acc)-(a.acc===null?-1:a.acc)) || a.id-b.id,
      cov: (a,b)=>a.cov-b.cov || a.id-b.id,
      covDesc: (a,b)=>b.cov-a.cov || a.id-b.id,
    };
    const chs = [...d.chapters].sort(sorters[state.overviewSort]||sorters.chapter);
    const reached = d.chapters.filter(c=>c.cov>=100 && c.acc!==null && c.acc>=ACC_TARGET).length;
    const sortBtn = (key,label)=>`<button class="toggle-btn ${state.overviewSort===key?'active':''}" data-ovsort="${key}" style="padding:6px 0;font-size:12px;flex:1 1 30%;">${label}</button>`;
    return `
      <div class="ov-card">
        <div class="section-title" style="margin-top:0;">📊 刷題總覽（乙級）</div>
        <div class="section-desc" style="margin-top:2px;">目標：全部題庫刷題 100%、正確率 ${ACC_TARGET}%　（甲種題庫在「甲種」分頁獨立計算）</div>
        <div style="display:flex;justify-content:space-around;margin-top:10px;">
          ${svgRing(d.allCov, "#5B6B82", `整體刷題 ${d.allSeen}/${d.allTotal} 題`)}
          ${svgRing(d.allAcc, allSt.color, d.allAcc===null ? "尚無作答記錄" : `${allSt.icon} 整體正確率 ${d.allC}/${d.allT}`)}
        </div>
        <div class="ov-legend"><span><i style="background:#5B6B82;"></i>刷題率（目標100%）</span><span><i style="background:#3F7D5C;"></i>正確率（✅≥${ACC_TARGET}% ⚠️60~${ACC_TARGET-1}% 🔥<60%）</span><span><i class="ov-legend-target"></i>${ACC_TARGET}%目標線</span></div>
        <div class="sub-title">各題庫</div>
        ${d.banks.map(b=>overviewRow(b.label, `${b.total} 題`, b, `data-goto="${b.key}"`)).join("")}
        <div class="sub-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>各章節（雙達標 ${reached}/${CHAPTERS.length} 章）</span>
        </div>
        <div class="toggle-row" style="margin:6px 0 8px;flex-wrap:wrap;">
          ${sortBtn('chapter','依章節')}${sortBtn('acc','正確率低→高')}${sortBtn('accDesc','正確率高→低')}
          ${sortBtn('cov','刷題率低→高')}${sortBtn('covDesc','刷題率高→低')}
        </div>
        <div class="section-desc" style="margin-top:0;">章節正確率＝該章「單一章節練習」累計成績。點任一列可直接進入該章練習。</div>
        ${chs.map(c=>overviewRow(c.label, c.title, c, `data-gochapter="${c.id}"`)).join("")}
      </div>`;
  }

  /* ---------- 甲種模擬考 ---------- */
  function computeExamAAccuracy(){
    let correct=0, total=0;
    state.examAHistory.forEach(h=>{ correct+=h.correct; total+=h.total; });
    return {correct, total, pct: total>0?Math.round(correct/total*100):0};
  }
  function renderExamA(){
    if(state.examA.length===0){
      return `<div class="empty-hint">甲種題庫尚未載入，請確認題庫檔案已正確引入。</div>`;
    }
    // 2026-10-27 甲業的刷題率、正確率、錯題本全部集中在甲種分頁獨立看，總覽與錯題本分頁不再計入甲種題庫
    if(state.quizPool.length>0 && state.quizMode==='examAwrong'){
      return renderWrongReview('甲業錯題複習');
    }
    if(state.examAPool.length===0){
      const seenCount = state.examA.filter(q=>state.examASeenIds[q.id]).length;
      const coveragePct = state.examA.length>0 ? Math.round(seenCount/state.examA.length*100) : 0;
      const acc = computeExamAAccuracy();
      const accPct = acc.total>0 ? acc.pct : null;
      const st = accStatus(accPct);
      const wq = computeWrongQuestions('examA');
      return `
        <div class="section-title">甲種業務主管模擬考</div>
        <div class="section-desc">題庫共 ${state.examA.length} 題，每次模擬考隨機抽 50 題作答，優先抽還沒刷過的題目、刷完一輪才會重複；答錯會自動送入下方「甲業錯題本」，不會混進乙級錯題本。甲業的刷題率、正確率只在這個分頁計算，不併入總覽。</div>
        <div style="display:flex;justify-content:space-around;background:#fff;border:1px solid #E7E1D4;border-radius:14px;padding:14px;">
          ${svgRing(coveragePct, "#5B6B82", `甲業刷題 ${seenCount}/${state.examA.length} 題`)}
          ${svgRing(accPct, st.color, accPct===null ? "尚無作答記錄" : `${st.icon} 甲業正確率 ${acc.correct}/${acc.total}`)}
        </div>
        <div class="section-desc" style="margin-top:0;">目標：刷題 100%、正確率 ${ACC_TARGET}%</div>
        <button class="primary-btn" id="startExamABtn">📝 開始模擬考（50 題）</button>
        ${state.examAStats.total>0 ? `<div class="result-card">上一輪結果：${state.examAStats.correct} / ${state.examAStats.total} 答對</div>` : ""}
        ${renderExamAHistory()}
        <div class="section-title" style="margin-top:18px;">甲業錯題本（${wq.length}）</div>
        <div class="section-desc">甲種題庫（含由甲種題庫轉出的數字填空題）答錯的題目。複習測驗從這裡完全隨機抽題；連續答對 3 次就移出甲業錯題本，再答錯會依錯誤次數升級成「加強複習／重點加強」。</div>
        ${wq.length>0 ? `<button class="primary-btn" id="startExamAWrongBtn" style="margin-bottom:14px;">🔁 開始甲業錯題複習（本輪 ${Math.min(20,wq.length)} 題，隨機抽題）</button>` : ""}
        ${renderWrongStats('examA')}
        <div class="sub-title">待複習甲業錯題（${wq.length}，依錯誤次數排序）</div>
        ${wq.length===0?`<div class="empty-hint">目前沒有甲業錯題。</div>`:""}
        ${wq.map(q=>wrongCard(q,'examA')).join("")}
      `;
    }
    const current = state.examAPool[state.examAIdx];
    return `
      <div class="quiz-progress">第 ${state.examAIdx+1} / ${state.examAPool.length} 題 · 答對 ${state.examAStats.correct}</div>
      <div class="quiz-card">
        <div class="quiz-question">${esc(current.text)}</div>
        ${current.options.map((opt,i)=>{
          let cls="quiz-option";
          if(state.examARevealed){
            if(i===current.answer) cls+=" correct";
            else if(i===state.examASelected) cls+=" wrong";
          }
          return `<button class="${cls}" data-examachoose="${i}" ${state.examARevealed?'disabled':''}>
            <span class="quiz-option-label">${String.fromCharCode(65+i)}</span>${esc(opt)}
          </button>`;
        }).join("")}
        ${state.examARevealed ? renderExplain(current) : ""}
        ${state.examARevealed ? `<button class="primary-btn" id="nextExamABtn">${state.examAIdx+1<state.examAPool.length?'下一題':'完成本輪'}</button>` : ""}
      </div>
    `;
  }
  function renderExamAHistory(){
    if(state.examAHistory.length===0) return "";
    const rows = state.examAHistory.slice(0,10).map(h=>{
      const pct = h.total>0 ? Math.round(h.correct/h.total*100) : 0;
      return `<div class="wrong-top" style="justify-content:space-between;">
        <span class="q-chapter">${esc(h.date)}</span>
        <span>${h.correct} / ${h.total} 答對（${pct}%）</span>
      </div>`;
    }).join("");
    return `<div class="section-title" style="margin-top:18px;">模擬考成績記錄</div>${rows}`;
  }

  /* ---------- 乙級官方學科考古題模擬考 ---------- */
  function computeExamBAccuracy(){
    let correct=0, total=0;
    state.examBHistory.forEach(h=>{ correct+=h.correct; total+=h.total; });
    return {correct, total, pct: total>0?Math.round(correct/total*100):0};
  }
  function renderExamB(){
    if(state.examB.length===0){
      return `<div class="empty-hint">乙級學科考古題庫尚未載入，請確認題庫檔案已正確引入。</div>`;
    }
    if(state.examBPool.length===0){
      const seenCount = state.examB.filter(q=>state.examBSeenIds[q.id]).length;
      const coveragePct = state.examB.length>0 ? Math.round(seenCount/state.examB.length*100) : 0;
      const acc = computeExamBAccuracy();
      return `
        <div class="section-title">22200 職業安全衛生管理乙級 學科考古題模擬考</div>
        <div class="section-desc">題庫共 ${state.examB.length} 題，每次模擬考隨機抽 50 題作答，優先抽還沒刷過的題目、刷完一輪才會重複；答錯會自動送入錯題本，跟乙級章節練習共用同一本錯題本。</div>
        <div class="section-desc">已刷過 ${seenCount} / ${state.examB.length} 題（${coveragePct}%）　累計正確率 ${acc.pct}%（${acc.correct}/${acc.total}）</div>
        <button class="primary-btn" id="startExamBBtn">📝 開始模擬考（50 題）</button>
        ${state.examBStats.total>0 ? `<div class="result-card">上一輪結果：${state.examBStats.correct} / ${state.examBStats.total} 答對</div>` : ""}
        ${renderExamBHistory()}
      `;
    }
    const current = state.examBPool[state.examBIdx];
    // 複選題：examBSelected 存已勾選的選項陣列，按「提交答案」才判斷對錯
    const isMulti = current.type==='multi';

    return `

      <div class="quiz-card">

            const isPicked = isMulti ? picked.includes(i) : i===state.examBSelected;
            if(isAns) cls+=" correct";
            else if(isPicked) cls+=" wrong";
          }
          const label = isMulti && picked.includes(i) && !state.examBRevealed ? '✓' : String.fromCharCode(65+i);
          return `<button class="${cls}" ${isMulti?'data-exambtoggle':'data-exambchoose'}="${i}" ${state.examBRevealed?'disabled':''}>

        ${state.examBRevealed ? renderExplain(current) : ""}

  function renderExamBHistory(){
    if(state.examBHistory.length===0) return "";

  /* ---------- Sync / Backup ---------- */
  function getCloudSyncPayload(){
    return {
      v:1,
      examDate: state.examDate,
      chapterState: state.chapterState,
      wrongMap: state.wrongMap,
      studyLog: state.studyLog,
      quizHistory: state.quizHistory,
      quizSeenIds: state.quizSeenIds,
      examAHistory: state.examAHistory,
      examASeenIds: state.examASeenIds,
      examBHistory: state.examBHistory,
      examBSeenIds: state.examBSeenIds,
      syncedAt: new Date().toISOString()
    };
  }
  const CHAPTER_STATUS_RANK = {todo:0, reading:1, done:2};
  function mergeProgress(local, cloud){
    cloud = cloud || {};
    const merged = {};
    merged.examDate = local.examDate || cloud.examDate || "";

    merged.chapterState = {...(cloud.chapterState||{}), ...(local.chapterState||{})};
    Object.keys(merged.chapterState).forEach(id=>{
      const l = (local.chapterState||{})[id], c = (cloud.chapterState||{})[id];
      if(l && c){
        const status = (CHAPTER_STATUS_RANK[l.status]||0) >= (CHAPTER_STATUS_RANK[c.status]||0) ? l.status : c.status;
        merged.chapterState[id] = {status, notes: l.notes || c.notes || ""};
      }
    });

    merged.wrongMap = {...(cloud.wrongMap||{})};
    Object.keys(local.wrongMap||{}).forEach(id=>{
      const l = local.wrongMap[id], c = merged.wrongMap[id];
      if(!c){ merged.wrongMap[id] = l; return; }
      // 已熟記（mastered）是單向的，任一邊已熟記，合併結果就必須維持已熟記，不能被另一邊較舊的紀錄蓋回未熟記
      // 2026-10-17 起已學會的題目再答錯會回到錯題本，所以以較新的紀錄為準；時間相同或缺失時才維持已熟記
      if(l.mastered || c.mastered){
        const lt = l.updatedAt||(l.lastSeen?l.lastSeen+'T00:00:00':''), ct = c.updatedAt||(c.lastSeen?c.lastSeen+'T00:00:00':'');
        if(lt && ct && lt!==ct){ merged.wrongMap[id] = lt>ct ? l : c; }
        else { merged.wrongMap[id] = {...(lt>=ct?l:c), mastered:true}; }
        return;
      }
      // lastSeen 只精確到日期，同一天內多次作答（例如錯題複習測驗連續答對）會比不出先後，
      // 改用完整時間戳記 updatedAt 判斷何者較新為準；舊資料沒有 updatedAt 時退回用 lastSeen 當天 00:00 比較。
      // 時間戳記打平（都缺失、或剛好同一天沒記錄）才退回比較累積進度分數，不能單純「任一項較高就贏」，
      // 否則會出現雲端明明整體較新，卻因為某個次要欄位本機比較高而被本機的舊資料誤蓋掉。
      const lTime = l.updatedAt || (l.lastSeen ? l.lastSeen+'T00:00:00' : '');
      const cTime = c.updatedAt || (c.lastSeen ? c.lastSeen+'T00:00:00' : '');
      if(lTime > cTime){
        merged.wrongMap[id] = l;
      } else if(lTime === cTime){
        const lScore = (l.wrongCount||0)*10 + (l.correctStreak||0);
        const cScore = (c.wrongCount||0)*10 + (c.correctStreak||0);
        if(lScore > cScore) merged.wrongMap[id] = l;
      }
    });

    merged.studyLog = {...(cloud.studyLog||{}), ...(local.studyLog||{})};
    merged.quizSeenIds = {...(cloud.quizSeenIds||{}), ...(local.quizSeenIds||{})};
    merged.examASeenIds = {...(cloud.examASeenIds||{}), ...(local.examASeenIds||{})};
    merged.examBSeenIds = {...(cloud.examBSeenIds||{}), ...(local.examBSeenIds||{})};

    function mergeHistory(a, b){
      const combined = [...(a||[]), ...(b||[])];
      const seen = new Set();
      const deduped = combined.filter(h=>{
        const key = h.date+'|'+h.correct+'|'+h.total+'|'+h.chapter+'|'+h.mode;
        if(seen.has(key)) return false;
        seen.add(key); return true;
      });
      deduped.sort((x,y)=>(y.date||"").localeCompare(x.date||""));
      return deduped.slice(0,300);
    }
    merged.quizHistory = mergeHistory(local.quizHistory, cloud.quizHistory);
    merged.examAHistory = mergeHistory(local.examAHistory, cloud.examAHistory);
    merged.examBHistory = mergeHistory(local.examBHistory, cloud.examBHistory);

    // 雲端可能還留著舊裝置寫上去的重複題 id，合併後一併轉到保留的那題，回寫雲端時也就清掉了
    return applyDupAlias(merged);
  }
  function applyMergedProgress(merged){
    state.examDate = merged.examDate;
    state.chapterState = merged.chapterState;
    state.wrongMap = merged.wrongMap;
    state.studyLog = merged.studyLog;
    state.quizSeenIds = merged.quizSeenIds;
    state.examASeenIds = merged.examASeenIds;
    state.quizHistory = merged.quizHistory;
    state.examAHistory = merged.examAHistory;
    state.examBSeenIds = merged.examBSeenIds;
    state.examBHistory = merged.examBHistory;
    saveData("meta", {examDate: state.examDate});
    saveData("chapterState", state.chapterState);
    saveData("wrongMap", state.wrongMap);
    saveData("studyLog", state.studyLog);
    saveData("quizSeenIds", state.quizSeenIds);
    saveData("examASeenIds", state.examASeenIds);
    saveData("quizHistory", state.quizHistory);
    saveData("examAHistory", state.examAHistory);
    saveData("examBSeenIds", state.examBSeenIds);
    saveData("examBHistory", state.examBHistory);
  }
  function runCloudSync(opts){
    opts = opts || {};
    if(!CLOUD_SYNC_URL){
      if(!opts.silent){ state.cloudSyncMsg = "✕ 尚未設定雲端網址"; render(); }
      return;
    }
    if(!opts.silent){ state.cloudSyncMsg = "同步中…"; render(); }
    const cbName = "ohsCloudSync_" + Date.now();
    const scriptEl = document.createElement("script");
    window[cbName] = function(cloudData){
      delete window[cbName];
      scriptEl.remove();
      try{
        const local = getCloudSyncPayload();
        const merged = mergeProgress(local, cloudData);
        applyMergedProgress(merged);
        fetch(CLOUD_SYNC_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify(merged)
        }).catch(()=>{});
        state.cloudSyncMsg = "✓ 已同步（" + new Date().toLocaleString('zh-TW') + "）";
      } catch(err){
        state.cloudSyncMsg = "✕ 同步失敗：" + err.message;
      }
      render();
    };
    scriptEl.onerror = ()=>{
      delete window[cbName];
      if(!opts.silent){ state.cloudSyncMsg = "✕ 無法連上雲端，請檢查網路連線"; render(); }
    };
    scriptEl.src = CLOUD_SYNC_URL + (CLOUD_SYNC_URL.includes('?')?'&':'?') + "callback=" + cbName;
    document.body.appendChild(scriptEl);
  }

    return `

      <button class="primary-btn" id="cloudSyncBtn" style="margin-top:8px;background:#2f6b4f;">☁️ 同步進度到雲端</button>
      ${cloudMsg ? `<div style="font-size:13px;margin-top:8px;padding:10px;border-radius:8px;background:${cloudMsg.startsWith('✓')?'#e1efe5':'#faeae7'};color:${cloudMsg.startsWith('✓')?'#2f6b4f':'#b9554a'};">${esc(cloudMsg)}</div>` : ""}

      <div style="margin-top:20px;border-top:1px solid #E7E1D4;padding-top:16px;">

  /* ---------- events ---------- */
  function bindEvents(){
    root.querySelectorAll("[data-tab]").forEach(el=>el.addEventListener("click",()=>{ state.tab=el.dataset.tab; render(); }));
    root.querySelectorAll("[data-goto]").forEach(el=>el.addEventListener("click",()=>{ state.tab=el.dataset.goto; render(); }));

    const examBadge = document.getElementById("examBadge");
    if(examBadge) examBadge.addEventListener("click",()=>{ state.headerEditing=true; render(); });
    const examDateInput = document.getElementById("examDateInput");
    if(examDateInput) examDateInput.addEventListener("change",(e)=>{ state.examDate=e.target.value; persist("meta"); });
    const examDoneBtn = document.getElementById("examDoneBtn");
    if(examDoneBtn) examDoneBtn.addEventListener("click",()=>{ state.headerEditing=false; render(); });

    const markBtn = document.getElementById("markTodayBtn");
    if(markBtn) markBtn.addEventListener("click",()=>{ markStudiedToday(); render(); });

      const cur = state.chapterState[id]?.status||"todo";

    }));
    root.querySelectorAll("[data-chartexpand]").forEach(el=>el.addEventListener("click",()=>{
      const id = parseInt(el.dataset.chartexpand,10);
      state.chartExpandedChapter = state.chartExpandedChapter===id ? null : id;

    }));
    root.querySelectorAll("[data-notes]").forEach(el=>el.addEventListener("change",()=>{
      const id = parseInt(el.dataset.notes,10);
      state.chapterState[id] = {...state.chapterState[id], notes:el.value};
      persist("chapterState");
    }));

    root.querySelectorAll("[data-bankmode]").forEach(el=>el.addEventListener("click",()=>{
      state.bankMode = el.dataset.bankmode; render();
    }));

    const draftChapter = document.getElementById("draftChapter");
    if(draftChapter) draftChapter.addEventListener("change",e=>{ state.bankDraft.chapter=parseInt(e.target.value,10); });
    const draftText = document.getElementById("draftText");
    if(draftText) draftText.addEventListener("input",e=>{ state.bankDraft.text=e.target.value; });
    root.querySelectorAll("[data-draftopt]").forEach(el=>el.addEventListener("input",e=>{
      const i = parseInt(el.dataset.draftopt,10);
      state.bankDraft.options[i] = e.target.value;
    }));
    root.querySelectorAll("[data-draftans]").forEach(el=>el.addEventListener("change",()=>{
      state.bankDraft.answer = parseInt(el.dataset.draftans,10);
    }));
    const addManualBtn = document.getElementById("addManualBtn");
    if(addManualBtn) addManualBtn.addEventListener("click",()=>{
      const d = state.bankDraft;
      if(!d.text.trim() || d.options.some(o=>!o.trim())){ alert("請完整填寫題目與四個選項"); return; }
      state.questions.push({id:uid(), ...d, options:[...d.options]});
      state.bankDraft = {chapter:1,text:"",options:["","","",""],answer:0,note:""};
      persist("questions"); render();
    });

    const bulkChapterSelect = document.getElementById("bulkChapterSelect");
    if(bulkChapterSelect) bulkChapterSelect.addEventListener("change",e=>{ state.bankFilterChapter=parseInt(e.target.value,10); });
    const bulkText = document.getElementById("bulkText");
    if(bulkText) bulkText.addEventListener("input",e=>{ state.bankBulkText=e.target.value; });
    const bulkImportBtn = document.getElementById("bulkImportBtn");
    if(bulkImportBtn) bulkImportBtn.addEventListener("click",()=>{
      const blocks = state.bankBulkText.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
      const parsed=[]; const errors=[];
      const targetChapter = state.bankFilterChapter==='all'?1:state.bankFilterChapter;
      blocks.forEach((block,idx)=>{
        const lines = block.split("\n").map(l=>l.trim()).filter(Boolean);
        if(lines.length<6){ errors.push(`第 ${idx+1} 段格式不足（需要題目+4選項+答案，共6行）`); return; }
        const text = lines[0].replace(/^\d+[\.、]\s*/,"");
        const options = lines.slice(1,5).map(l=>l.replace(/^[\(（]?[1234ABCD][\)）\.、]\s*/,""));
        const ansRaw = lines[5].replace(/[^0-9ABCDabcd]/g,"");
        let answer=-1;
        if(/^[1-4]$/.test(ansRaw)) answer=parseInt(ansRaw,10)-1;
        else if(/^[A-Da-d]$/.test(ansRaw)) answer="ABCD".indexOf(ansRaw.toUpperCase());
        if(answer===-1){ errors.push(`第 ${idx+1} 段答案無法判讀：「${lines[5]}」`); return; }
        parsed.push({id:uid(), chapter:targetChapter, text, options, answer, note:""});
      });
      if(parsed.length) state.questions.push(...parsed);
      state.bankBulkMsg = `已匯入 ${parsed.length} 題${errors.length?`，${errors.length} 段失敗：\n`+errors.join("\n"):"。"}`;
      if(parsed.length) state.bankBulkText="";
      persist("questions"); render();
    });

    const bankFilterSelect = document.getElementById("bankFilterSelect");
    if(bankFilterSelect) bankFilterSelect.addEventListener("change",e=>{
      state.bankFilterChapter = e.target.value==="all"?"all":parseInt(e.target.value,10);
      render();
    });
    root.querySelectorAll("[data-delq]").forEach(el=>el.addEventListener("click",()=>{
      state.questions = state.questions.filter(q=>q.id!==el.dataset.delq);
