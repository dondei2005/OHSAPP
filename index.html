    }));

    const quizChapterSelect = document.getElementById("quizChapterSelect");
    if(quizChapterSelect) quizChapterSelect.addEventListener("change",e=>{
      state.quizChapterFilter = e.target.value==="all"?"all":parseInt(e.target.value,10);
      persist("quizChapterFilter");
      render();
    });
    // 依「還沒出現過優先」排序：先洗牌未作答過的題目，再接洗牌過的已作答題目
    function orderBySeenFirst(src){
      const unseen = src.filter(q=>!state.quizSeenIds[q.id]);
      const seen = src.filter(q=>state.quizSeenIds[q.id]);
      return [...unseen].sort(()=>Math.random()-0.5).concat([...seen].sort(()=>Math.random()-0.5));
    }
    // 練習題組完成或中途結束時記錄成績歷史；chapter 模式且有指定章節時，連同章節編號一起記錄，
    // 讓「本章節成績記錄」可以依章節篩選，用來追蹤該章節熟練度趨勢
    function recordQuizHistoryIfNeeded(){
      if((state.quizMode==="random20" || state.quizMode==="chapter" || state.quizMode==="numeric") && state.quizStats.total>0){
        const chapter = (state.quizMode==="chapter" && state.quizChapterFilter!=="all") ? state.quizChapterFilter : null;
        const entry = {date:todayStr(), correct:state.quizStats.correct, total:state.quizStats.total, chapter};
        if(state.quizMode==="numeric") entry.mode = "numeric"; // 數字填空的成績另外標記，不混進綜合隨機測驗的成績列表
        state.quizHistory = [entry, ...state.quizHistory].slice(0,300);
        persist("quizHistory");
        runCloudSync({silent:true}); // 一輪練習結束就順手同步一次，不用等使用者記得手動按或切走APP
      }
    }
    const startQuizBtn = document.getElementById("startQuizBtn");
    if(startQuizBtn) startQuizBtn.addEventListener("click",()=>{
      const src = (state.quizChapterFilter==="all" ? state.questions : state.questions.filter(q=>q.chapter===state.quizChapterFilter)).filter(isActiveQ);
      // 每輪以 50 題為單位（該範圍不滿 50 題就整批做完），未刷過的題目優先排入
      state.quizPool = orderBySeenFirst(src).slice(0,50).map(presentQuestion);
      state.quizMode = "chapter";
      state.quizIdx=0; state.quizSelected=null; state.quizRevealed=false; state.quizStats={correct:0,total:0};
      state.quizMultiSelected=[]; state.quizFillInput=""; state.quizFillCorrect=false;
      persistQuizState();
      render();
    });
    const startRandom20Btn = document.getElementById("startRandom20Btn");
    if(startRandom20Btn) startRandom20Btn.addEventListener("click",()=>{
      state.quizPool = orderBySeenFirst(state.questions.filter(isActiveQ)).slice(0,20).map(presentQuestion);
      state.quizMode = "random20";
      state.quizIdx=0; state.quizSelected=null; state.quizRevealed=false; state.quizStats={correct:0,total:0};
      state.quizMultiSelected=[]; state.quizFillInput=""; state.quizFillCorrect=false;
      persistQuizState();
      render();
    });
    const startNumericBtn = document.getElementById("startNumericBtn");
    if(startNumericBtn) startNumericBtn.addEventListener("click",()=>{
      state.quizPool = orderBySeenFirst(numericPoolB()).slice(0,20);
      state.quizMode = "numeric";
      state.quizIdx=0; state.quizSelected=null; state.quizRevealed=false; state.quizStats={correct:0,total:0};
      state.quizMultiSelected=[]; state.quizFillInput=""; state.quizFillCorrect=false;
      persistQuizState();
      render();
    });
    root.querySelectorAll("[data-ovsort]").forEach(el=>el.addEventListener("click",()=>{
      state.overviewSort = el.dataset.ovsort; render();
    }));
    root.querySelectorAll("[data-gochapter]").forEach(el=>el.addEventListener("click",()=>{
      state.quizChapterFilter = parseInt(el.dataset.gochapter,10);
      persist("quizChapterFilter");
      state.tab = "quiz"; render(); window.scrollTo(0,0);
    }));
    // 錯題本章節分類：展開／收起該章題目清單、開始該章錯題加強（最多 20 題，這章還沒練過的錯題優先）
    root.querySelectorAll("[data-wrongsort]").forEach(el=>el.addEventListener("click",()=>{
      state.wrongSort = el.dataset.wrongsort; render();
    }));
    root.querySelectorAll("[data-wrongview]").forEach(el=>el.addEventListener("click",()=>{
      state.wrongOpenCh = state.wrongOpenCh===el.dataset.wrongview ? null : el.dataset.wrongview;
      render();
    }));
    function startWrongRound(list, rv, ch){
      state.quizPool = list.slice(0,20).map(q=>({...presentQuestion(q), _rv:rv, _rvCh:ch}));
      state.quizMode = "wrongreview";
      state.quizIdx=0; state.quizSelected=null; state.quizRevealed=false; state.quizStats={correct:0,total:0};
      state.quizMultiSelected=[]; state.quizFillInput=""; state.quizFillCorrect=false;
      persistQuizState();
      render(); window.scrollTo(0,0);
    }
    root.querySelectorAll("[data-wrongch]").forEach(el=>el.addEventListener("click",()=>{
      const key = el.dataset.wrongch;
      const c = computeWrongChapters().chapters.find(x=>x.key===key);
      if(!c || c.pending.length===0) return;
      const fresh = shuffleArr(c.pending.filter(q=>!(q.meta.cN>0)));
      const done = shuffleArr(c.pending.filter(q=>q.meta.cN>0));
      startWrongRound(fresh.concat(done), 'ch', key);
    }));
    const startWrongMixBtn = document.getElementById("startWrongMixBtn");
    if(startWrongMixBtn) startWrongMixBtn.addEventListener("click",()=>{
      // 跨全部章節隨機抽 20 題；全章節隨機還沒做過的錯題優先，刷題率才推得到 100%
      const all = computeWrongChapters().pendingAll;
      startWrongRound(shuffleArr(all.filter(q=>!(q.meta.xN>0))).concat(shuffleArr(all.filter(q=>q.meta.xN>0))), 'mix', null);
    });
    root.querySelectorAll("[data-wrongbook]").forEach(el=>el.addEventListener("click",()=>{
      state.wrongBook = el.dataset.wrongbook;
      persist("wrongBook"); render();
    }));
    const startWrongReviewBtn = document.getElementById("startWrongReviewBtn");
    if(startWrongReviewBtn) startWrongReviewBtn.addEventListener("click",()=>{
      // 2026-10-12 改：全部錯題完全隨機抽 20 題（不再優先抽錯最多次的）；
      // 錯題每次進入複習都重新打亂選項順序，避免記住「答案在C」而不是真的記住內容
      let wq;
      if(state.wrongBook==='learned'){
        wq = computeLearnedQuestions();   // 已學會錯題本：不打亂，錯越多次越先出
      } else {
        wq = computeWrongQuestions('main').filter(isActiveQ);
        for(let i=wq.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [wq[i],wq[j]]=[wq[j],wq[i]]; }
      }
      state.quizPool = wq.slice(0,20).map(presentQuestion);
      state.quizMode = "wrongreview";
      state.quizIdx=0; state.quizSelected=null; state.quizRevealed=false; state.quizStats={correct:0,total:0};
      state.quizMultiSelected=[]; state.quizFillInput=""; state.quizFillCorrect=false;
      persistQuizState();
      render();
    });
    // 甲種分頁的甲業錯題複習：一樣全隨機抽 20 題，作答介面沿用練習題組（quizPool），模式另記 examAwrong
    const startExamAWrongBtn = document.getElementById("startExamAWrongBtn");
    if(startExamAWrongBtn) startExamAWrongBtn.addEventListener("click",()=>{
      const wq = computeWrongQuestions('examA').filter(isActiveQ);
      for(let i=wq.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [wq[i],wq[j]]=[wq[j],wq[i]]; }
      state.quizPool = wq.slice(0,20).map(presentQuestion);
      state.quizMode = "examAwrong";
      state.quizIdx=0; state.quizSelected=null; state.quizRevealed=false; state.quizStats={correct:0,total:0};
      state.quizMultiSelected=[]; state.quizFillInput=""; state.quizFillCorrect=false;
      persistQuizState();
      render();
    });
    const quizExitBtn = document.getElementById("quizExitBtn");
    if(quizExitBtn) quizExitBtn.addEventListener("click",()=>{
      recordQuizHistoryIfNeeded();
      state.quizPool=[]; state.quizIdx=0; state.quizSelected=null; state.quizRevealed=false;
      state.quizStats={correct:0,total:0}; state.quizMultiSelected=[]; state.quizFillInput=""; state.quizFillCorrect=false;
      persistQuizState();
      render();
    });
    function recordAnswer(current, correct){
      markStudiedToday();
      state.quizStats = {correct: state.quizStats.correct+(correct?1:0), total: state.quizStats.total+1};
      recordWrongMapOutcome(current.id, correct);
      // 錯題本的章節練習（_rv='ch'）／全章節隨機（_rv='mix'）另外累計作答與答對次數，給錯題本算刷題率、正確率
      const rec = state.wrongMap[current.id];
      if(current._rv && rec){
        const [nK,cK] = current._rv==='mix' ? ['xN','xC'] : ['cN','cC'];
        state.wrongMap[current.id] = {...rec, [nK]:(rec[nK]||0)+1, [cK]:(rec[cK]||0)+(correct?1:0)};
        persist("wrongMap");
      }
      state.quizSeenIds[current.id] = true;
      persist("quizSeenIds");
    }
    root.querySelectorAll("[data-choose]").forEach(el=>el.addEventListener("click",()=>{
      if(state.quizRevealed) return;
      const raw = el.dataset.choose;
      const val = (raw==="true"||raw==="false") ? raw : parseInt(raw,10);
      const current = state.quizPool[state.quizIdx];
      state.quizSelected = val; state.quizRevealed = true;
      recordAnswer(current, val===current.answer);
      persistQuizState();
      render();
    }));
    root.querySelectorAll("[data-multitoggle]").forEach(el=>el.addEventListener("click",()=>{
      if(state.quizRevealed) return;
      const i = parseInt(el.dataset.multitoggle,10);
      const idx = state.quizMultiSelected.indexOf(i);
      if(idx>=0) state.quizMultiSelected.splice(idx,1); else state.quizMultiSelected.push(i);
      persist("quizMultiSelected");
      render();
    }));
    const multiSubmitBtn = document.getElementById("multiSubmitBtn");
    if(multiSubmitBtn) multiSubmitBtn.addEventListener("click",()=>{
      const current = state.quizPool[state.quizIdx];
      const a = [...state.quizMultiSelected].sort();
      const b = [...current.answer].sort();
      const correct = a.length===b.length && a.every((v,i2)=>v===b[i2]);
      state.quizRevealed = true;
      recordAnswer(current, correct);
      persistQuizState();
      render();
    });
    const fillInputEl = document.getElementById("fillInput");
    if(fillInputEl) fillInputEl.addEventListener("input",e=>{ state.quizFillInput = e.target.value; persist("quizFillInput"); });
    const fillSubmitBtn = document.getElementById("fillSubmitBtn");
    if(fillSubmitBtn) fillSubmitBtn.addEventListener("click",()=>{
      const current = state.quizPool[state.quizIdx];
      const correct = isFillCorrect(current, state.quizFillInput);
      state.quizFillCorrect = correct;
      state.quizRevealed = true;
      recordAnswer(current, correct);
      persistQuizState();
      render();
    });
    const nextQuizBtn = document.getElementById("nextQuizBtn");
    if(nextQuizBtn) nextQuizBtn.addEventListener("click",()=>{
      if(state.quizIdx+1<state.quizPool.length){
        state.quizIdx++; state.quizSelected=null; state.quizRevealed=false;
        state.quizMultiSelected=[]; state.quizFillInput=""; state.quizFillCorrect=false;
      } else {
        recordQuizHistoryIfNeeded();
        state.quizPool=[];
      }
      persistQuizState();
      render();
    });

    const startExamABtn = document.getElementById("startExamABtn");
    if(startExamABtn) startExamABtn.addEventListener("click",()=>{
      const unseen = state.examA.filter(q=>isActiveQ(q) && !state.examASeenIds[q.id]);
      const seen = state.examA.filter(q=>isActiveQ(q) && state.examASeenIds[q.id]);
      const shuffledUnseen = [...unseen].sort(()=>Math.random()-0.5);
      let pool;
      if(shuffledUnseen.length >= 50){
        pool = shuffledUnseen.slice(0,50);
      } else {
        const shuffledSeen = [...seen].sort(()=>Math.random()-0.5);
        pool = [...shuffledUnseen, ...shuffledSeen].slice(0,50);
      }
      state.examAPool = pool.map(presentQuestion);
      state.examAIdx=0; state.examASelected=null; state.examARevealed=false; state.examAStats={correct:0,total:0};
      render();
    });
    root.querySelectorAll("[data-examachoose]").forEach(el=>el.addEventListener("click",()=>{
      if(state.examARevealed) return;
      const i = parseInt(el.dataset.examachoose,10);
      const current = state.examAPool[state.examAIdx];
      state.examASelected = i; state.examARevealed = true;
      const correct = i===current.answer;
      state.examAStats = {correct: state.examAStats.correct+(correct?1:0), total: state.examAStats.total+1};
      state.examASeenIds[current.id] = true;
      persist("examASeenIds");
      markStudiedToday();
      recordWrongMapOutcome(current.id, correct);
      render();
    }));
    const nextExamABtn = document.getElementById("nextExamABtn");
    if(nextExamABtn) nextExamABtn.addEventListener("click",()=>{
      if(state.examAIdx+1<state.examAPool.length){
        state.examAIdx++; state.examASelected=null; state.examARevealed=false;
      } else {
        state.examAHistory = [{date:todayStr(), correct:state.examAStats.correct, total:state.examAStats.total}, ...state.examAHistory].slice(0,50);
        persist("examAHistory");
        runCloudSync({silent:true});
        state.examAPool=[];
      }
      render();
    });

    const startExamBBtn = document.getElementById("startExamBBtn");
    if(startExamBBtn) startExamBBtn.addEventListener("click",()=>{
      const unseen = state.examB.filter(q=>isActiveQ(q) && !state.examBSeenIds[q.id]);
      const seen = state.examB.filter(q=>isActiveQ(q) && state.examBSeenIds[q.id]);
      const shuffledUnseen = [...unseen].sort(()=>Math.random()-0.5);
      let pool;
      if(shuffledUnseen.length >= 50){
        pool = shuffledUnseen.slice(0,50);
      } else {
        const shuffledSeen = [...seen].sort(()=>Math.random()-0.5);
        pool = [...shuffledUnseen, ...shuffledSeen].slice(0,50);
      }
      state.examBPool = pool.map(presentQuestion);
      state.examBIdx=0; state.examBSelected=null; state.examBRevealed=false; state.examBStats={correct:0,total:0};
      render();
    });
    root.querySelectorAll("[data-exambchoose]").forEach(el=>el.addEventListener("click",()=>{
      if(state.examBRevealed) return;
      const i = parseInt(el.dataset.exambchoose,10);
      const current = state.examBPool[state.examBIdx];
      state.examBSelected = i; state.examBRevealed = true;
      finishExamBAnswer(current, i===current.answer);
    }));
    root.querySelectorAll("[data-exambtoggle]").forEach(el=>el.addEventListener("click",()=>{
      if(state.examBRevealed) return;
      const i = parseInt(el.dataset.exambtoggle,10);
      const sel = Array.isArray(state.examBSelected) ? [...state.examBSelected] : [];
      const at = sel.indexOf(i);
      if(at>=0) sel.splice(at,1); else sel.push(i);
      state.examBSelected = sel;
      render();
    }));
    const examBMultiSubmitBtn = document.getElementById("examBMultiSubmitBtn");
    if(examBMultiSubmitBtn) examBMultiSubmitBtn.addEventListener("click",()=>{
      const current = state.examBPool[state.examBIdx];
      const a = (Array.isArray(state.examBSelected) ? [...state.examBSelected] : []).sort();
      const b = [...current.answer].sort();
      state.examBSelected = a;
      state.examBRevealed = true;
      finishExamBAnswer(current, a.length===b.length && a.every((v,i2)=>v===b[i2]));
    });
    function finishExamBAnswer(current, correct){
      state.examBStats = {correct: state.examBStats.correct+(correct?1:0), total: state.examBStats.total+1};
      state.examBSeenIds[current.id] = true;
      persist("examBSeenIds");
      markStudiedToday();
      recordWrongMapOutcome(current.id, correct);
      render();
    }
    const nextExamBBtn = document.getElementById("nextExamBBtn");
    if(nextExamBBtn) nextExamBBtn.addEventListener("click",()=>{
      if(state.examBIdx+1<state.examBPool.length){
        state.examBIdx++; state.examBSelected=null; state.examBRevealed=false;
      } else {
        state.examBHistory = [{date:todayStr(), correct:state.examBStats.correct, total:state.examBStats.total}, ...state.examBHistory].slice(0,50);
        persist("examBHistory");
        runCloudSync({silent:true});
        state.examBPool=[];
      }
      render();
    });

    root.querySelectorAll("[data-showans]").forEach(el=>el.addEventListener("click",()=>{
      const box = root.querySelector(`[data-ansbox="${el.dataset.showans}"]`);
      if(box){ box.style.display="block"; el.style.display="none"; }
    }));
    root.querySelectorAll("[data-mastered]").forEach(el=>el.addEventListener("click",()=>{
      const id = el.dataset.mastered;
      state.wrongMap[id] = {...state.wrongMap[id], mastered:true, updatedAt:new Date().toISOString()};
      persist("wrongMap"); render();
    }));

    const lawSearchInput = document.getElementById("lawSearchInput");
    if(lawSearchInput){
      lawSearchInput.addEventListener("input",e=>{ state.lawQuery=e.target.value; render(); });
      lawSearchInput.focus();
      lawSearchInput.selectionStart = lawSearchInput.selectionEnd = lawSearchInput.value.length;
    }
    const lawToggleForm = document.getElementById("lawToggleForm");
    if(lawToggleForm) lawToggleForm.addEventListener("click",()=>{ state.lawShowForm=!state.lawShowForm; render(); });
    const bindLawField = (id,field)=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener("input",e=>{ state.lawDraft[field]=e.target.value; });
    };
    bindLawField("lawDraftLaw","law"); bindLawField("lawDraftArticle","article");
    bindLawField("lawDraftPenalty","penalty"); bindLawField("lawDraftRefs","refs"); bindLawField("lawDraftNote","note");
    const lawAddBtn = document.getElementById("lawAddBtn");
    if(lawAddBtn) lawAddBtn.addEventListener("click",()=>{
      const d = state.lawDraft;
      if(!d.article.trim() || !d.penalty.trim()){ alert("至少要填條號與罰則內容"); return; }
      state.laws.unshift({id:uid(), ...d, seed:false});
      state.lawDraft = {law:"職業安全衛生法",article:"",penalty:"",refs:"",note:""};
      state.lawShowForm=false;
      persist("laws"); render();
    });
    root.querySelectorAll("[data-dellaw]").forEach(el=>el.addEventListener("click",()=>{
      state.laws = state.laws.filter(l=>l.id!==el.dataset.dellaw);
      persist("laws"); render();
    }));

    /* --- 備份/還原 --- */
    // 題庫本身（questions/examA/examB）故意不放進匯出檔：每台裝置一律以當下載入的
    // questions.js/examA_questions.js/examB_questions.js（GitHub Pages 上最新版）為準，
    // 不然匯出檔會凍結當時的題庫快照，事後題庫有更新（新增章節/刪重複題）時，
    // 匯入舊檔會把題庫覆蓋回舊版本（跟雲端同步的設計原則一致，見getCloudSyncPayload）
    function getExportPayload(){
      return {
        v:1, examDate:state.examDate, chapterState:state.chapterState,
        wrongMap:state.wrongMap,
        studyLog:state.studyLog, laws:state.laws, quizHistory:state.quizHistory, quizSeenIds:state.quizSeenIds,
        examAHistory:state.examAHistory, examASeenIds:state.examASeenIds,
        examBHistory:state.examBHistory, examBSeenIds:state.examBSeenIds,
        exportedAt:new Date().toISOString()
      };
    }
    function applyImportPayload(data){
      if(!data.v||!data.chapterState) throw new Error("格式錯誤");
      state.examDate = data.examDate||"";
      state.chapterState = data.chapterState;
      state.wrongMap = data.wrongMap||{};
      state.studyLog = data.studyLog||{};
      state.laws = data.laws||LAW_SEED;
      state.quizHistory = data.quizHistory||[];
      state.quizSeenIds = data.quizSeenIds||{};
      state.examAHistory = data.examAHistory||[];
      state.examASeenIds = data.examASeenIds||{};
      state.examBHistory = data.examBHistory||[];
      state.examBSeenIds = data.examBSeenIds||{};
      applyDupAlias(state);
      saveData("meta",{examDate:state.examDate});
      saveData("chapterState",state.chapterState);
      saveData("wrongMap",state.wrongMap);
      saveData("studyLog",state.studyLog);
      saveData("laws",state.laws);
      saveData("quizHistory",state.quizHistory);
      saveData("quizSeenIds",state.quizSeenIds);
      saveData("examAHistory",state.examAHistory);
      saveData("examASeenIds",state.examASeenIds);
      saveData("examBHistory",state.examBHistory);
      saveData("examBSeenIds",state.examBSeenIds);
    }

    const cloudSyncBtn = document.getElementById("cloudSyncBtn");
    if(cloudSyncBtn) cloudSyncBtn.addEventListener("click",()=>{ runCloudSync(); });

    const shareExportBtn = document.getElementById("shareExportBtn");
    if(shareExportBtn) shareExportBtn.addEventListener("click",()=>{
      const json = JSON.stringify(getExportPayload(), null, 2);
      const blob = new Blob([json], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "職安衛讀書進度_" + todayStr() + ".json";
      a.click();
      URL.revokeObjectURL(url);
      state.syncMsg = "✓ 已下載備份檔案";
      render();
    });

    const importFileInput = document.getElementById("importFileInput");
    if(importFileInput) importFileInput.addEventListener("change", e=>{
      const file = e.target.files[0];
      if(!file) return;
      const msg = document.getElementById("importMsg");
      const reader = new FileReader();
      reader.onload = evt=>{
        try{
          const data = JSON.parse(evt.target.result);
          if(!confirm("確定匯入並覆蓋這台裝置的所有進度？")) return;
          applyImportPayload(data);
          if(msg){ msg.style.color="#2F6B4F"; msg.textContent="✓ 匯入成功！"; }
          setTimeout(()=>{ state.tab="dashboard"; render(); }, 1000);
        } catch(err){
          if(msg){ msg.style.color="#b9554a"; msg.textContent="失敗："+err.message; }
        }
      };
      reader.readAsText(file);
    });
  }

  // 手機真實使用情境：練習到一半直接切走APP/鎖螢幕，不會回來重新整理頁面，
  // 如果只靠開頁面時的靜默同步跟手動按鈕，這段練習永遠不會被推上雲端。
  // 加上「頁面被切到背景」時也靜默同步一次，這是手機瀏覽器最可靠會觸發的時機點。
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="hidden" && state.loaded){
      runCloudSync({silent:true});
    }
  });

  init();
})();
</script>
</body>
</html>
